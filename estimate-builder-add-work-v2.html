<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate builder — fixes — Paint Trade HQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400..700&display=swap');

  :root{
    /* ---- Color tokens ---- */
    --accent:        #4B3E86; /* Undercoat — primary accent, actions only */
    --accent-hover:  #5C4C9E;
    --accent-bg:     #F1EEFA; /* light tint for selected/AI surfaces */
    --accent-ink:    #34295E; /* darker text-on-tint variant */

    --success:       #1C8A4B; /* live / paid / accepted */
    --success-bg:    #E7F6ED;
    --warning:       #B45309; /* pending / due soon */
    --warning-bg:    #FCF0E1;
    --danger:        #C6382E; /* overdue / declined */
    --danger-bg:     #FBEAEA;

    --bg:            #FAF9F6;
    --surface:       #FFFFFF;
    --surface-sunken:#F4F2EE;
    --border:        #E7E3DA;
    --border-strong: #D8D3C7;

    --text-primary:  #1E1C1A;
    --text-secondary:#6B675F;
    --text-muted:    #9B968A;

    /* ---- Type ---- */
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

    /* ---- Spacing scale (base 4px) ---- */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-6: 24px;
    --sp-8: 32px;
    --sp-12: 48px;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 2px rgba(30,28,26,0.04), 0 1px 8px rgba(30,28,26,0.03);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family: inherit; cursor:pointer; }
  ::selection{ background: var(--accent-bg); color: var(--accent-ink); }

  .app{ display:flex; min-height:100vh; }
  /* ================= SIDEBAR ================= */
  .sidebar{
    width: 260px;
    flex-shrink:0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding: var(--sp-6) var(--sp-4) var(--sp-4);
    position: sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: var(--sp-3);
    padding: 0 var(--sp-2);
    margin-bottom: var(--sp-8);
  }
  .brand-mark{
    width:34px; height:34px;
    border-radius: 9px;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-text{ line-height:1.2; }
  .brand-name{ font-family: var(--font-display); font-weight:600; font-size:16px; color: var(--text-primary); }
  .brand-sub{ font-size:11.5px; color: var(--text-muted); margin-top:1px; }

  .nav-group{ margin-bottom: var(--sp-6); }
  .nav-group-label{
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 0 var(--sp-2);
    margin-bottom: var(--sp-2);
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap: var(--sp-3);
    padding: 9px var(--sp-2);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 1px;
    transition: background .12s ease, color .12s ease;
    position:relative;
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background: var(--surface-sunken); color: var(--text-primary); }
  .nav-item.active{ background: var(--accent-bg); color: var(--accent-ink); font-weight:600; }
  .nav-item.active svg{ opacity:1; }
  .nav-item .pro{
    margin-left:auto;
    font-size:10px;
    font-weight:600;
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 5px;
    padding: 2px 6px;
    letter-spacing: .01em;
  }

  .sidebar-footer{
    margin-top:auto;
    padding-top: var(--sp-4);
    border-top: 1px solid var(--border);
    display:flex;
    align-items:center;
    gap: var(--sp-3);
    padding-left: var(--sp-2);
  }
  .sidebar-footer .avatar{
    width:32px; height:32px;
    border-radius:50%;
    background: var(--accent);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display);
    font-weight:600;
    font-size:13px;
    flex-shrink:0;
  }
  .sidebar-footer-name{ font-size:13.5px; font-weight:600; color: var(--text-primary); }
  .sidebar-footer-role{ font-size:11.5px; color: var(--text-muted); }
  
  /* ================= MAIN — shared Estimates / Invoices list layout ================= */
  main{ flex:1; min-width:0; padding:var(--sp-6) var(--sp-12) var(--sp-12); max-width:1360px; }
  .page-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .page-title{ font-family:var(--font-display); font-weight:600; font-size:27px; margin:0 0 4px; letter-spacing:-0.01em; }
  .page-sub{ font-size:13.5px; color:var(--text-muted); margin:0; max-width:620px; line-height:1.45; }
  .page-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:inherit; font-size:13.5px; font-weight:600; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border:1px solid transparent; white-space:nowrap; }
  .btn svg{ width:15px; height:15px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:var(--surface); color:var(--text-primary); border-color:var(--border-strong); }
  .btn-ghost:hover{ background:var(--surface-sunken); }
  .btn-icon{ width:40px; height:40px; padding:0; justify-content:center; color:var(--accent); }
  .btn-icon svg{ width:18px; height:18px; }

  /* stat tiles — clickable filters */
  .stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:18px; }
  .stat{ text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:14px 16px 13px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:4px; transition:box-shadow .15s ease, border-color .15s ease, transform .15s ease; position:relative; }
  .stat:hover{ border-color:var(--accent); box-shadow:0 6px 20px rgba(30,28,26,0.09), 0 1px 3px rgba(30,28,26,0.06); transform:translateY(-2px); }
  .stat.active{ border-color:var(--accent); background:var(--accent-bg); }
  .stat .lbl{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .stat .lbl svg{ width:14px; height:14px; }
  .stat .val{ font-family:var(--font-mono); font-weight:700; font-size:24px; color:var(--text-primary); line-height:1.1; margin-top:2px; }
  .stat .sub{ font-size:12px; color:var(--text-secondary); }
  .stat.danger .lbl{ color:var(--danger); }
  .stat.danger .val{ color:var(--danger); }
  .stat.danger.active{ border-color:var(--danger); background:var(--danger-bg); }
  .stat.success .lbl{ color:var(--success); }
  .stat.success.active{ border-color:var(--success); background:var(--success-bg); }
  .stat.warning .lbl{ color:var(--warning); }
  .stat.warning.active{ border-color:var(--warning); background:var(--warning-bg); }
  .stat .go{ position:absolute; right:12px; top:12px; color:var(--text-muted); opacity:0; transition:opacity .12s; }
  .stat .go svg{ width:14px; height:14px; }
  .stat:hover .go{ opacity:.7; }

  /* toolbar: attention view + status tabs + search */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .tab{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:none; background:none; font-family:inherit; font-size:13px; font-weight:500; color:var(--text-secondary); cursor:pointer; transition:background-color .12s, color .12s; }
  .tab:hover{ background:var(--surface-sunken); }
  .tab.active{ background:var(--accent-bg); color:var(--accent-ink); font-weight:600; }
  .tab .n{ font-family:var(--font-mono); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--surface-sunken); padding:1px 6px; border-radius:999px; min-width:18px; text-align:center; }
  .tab.active .n{ color:var(--accent); background:#fff; }
  .tab.attn{ border:1px solid #F1D9B8; background:var(--warning-bg); color:#6B3F0A; font-weight:600; padding-left:9px; }
  .tab.attn svg{ width:14px; height:14px; color:var(--warning); }
  .tab.attn .n{ background:#F7E2C4; color:var(--warning); }
  .tab.attn.active{ background:var(--warning); border-color:var(--warning); color:#fff; }
  .tab.attn.active svg{ color:#fff; }
  .tab.attn.active .n{ background:rgba(255,255,255,.25); color:#fff; }
  .tab.attn.zero{ opacity:.55; }
  .tsep{ width:1px; height:20px; background:var(--border-strong); margin:0 6px; }
  .search-box{ display:flex; align-items:center; gap:8px; flex:1; min-width:240px; max-width:380px; margin-left:auto; background:var(--surface); border:1px solid var(--border); padding:8px 12px; border-radius:8px; }
  .search-box:focus-within{ border-color:var(--accent); }
  .search-box svg{ width:16px; height:16px; color:var(--text-muted); flex-shrink:0; }
  .search-box input{ flex:1; border:none; background:none; font:inherit; font-size:13.5px; color:var(--text-primary); outline:none; min-width:0; }
  .search-box button{ border:none; background:none; color:var(--text-muted); display:flex; padding:0; cursor:pointer; }
  .search-box button svg{ width:16px; height:16px; }

  /* table card */
  .table-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; overflow-x:auto; box-shadow:0 1px 2px rgba(30,28,26,0.03); }
  .trow{ display:flex; align-items:center; gap:12px; padding:11px 20px; border-bottom:1px solid var(--border); transition:background-color .12s; min-width:900px; }
  .trow:last-child{ border-bottom:none; }
  .trow.body{ cursor:pointer; }
  .trow.body:hover{ background:var(--accent-bg); }
  .thead{ background:var(--surface-sunken); padding:9px 20px; }
  .thead .c{ font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--text-muted); text-transform:uppercase; }
  .c{ min-width:0; font-size:13.5px; color:var(--text-primary); }
  .c .l1{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c .l2{ display:block; font-size:11.5px; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c.right{ text-align:right; }
  .mono{ font-family:var(--font-mono); font-size:13px; font-weight:500; }
  .strong{ font-weight:600; }
  .muted{ color:var(--text-muted); font-size:13px; }
  .clientlink{ color:var(--text-primary); font-weight:600; text-decoration:none; }
  .clientlink:hover{ color:var(--accent); text-decoration:underline; }
  .pillst{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pillst::before{ content:''; width:6px; height:6px; border-radius:3px; background:currentColor; opacity:.9; }
  .pillst.neutral{ background:var(--surface-sunken); color:var(--text-secondary); }
  .pillst.info{ background:var(--accent-bg); color:var(--accent-ink); }
  .pillst.success{ background:var(--success-bg); color:var(--success); }
  .pillst.warning{ background:var(--warning-bg); color:var(--warning); }
  .pillst.danger{ background:var(--danger-bg); color:var(--danger); }
  .act{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act svg{ width:14px; height:14px; flex-shrink:0; color:var(--text-muted); }
  .act.warning, .act.warning svg{ color:var(--warning); font-weight:600; }
  .act.danger, .act.danger svg{ color:var(--danger); font-weight:600; }
  .act.success svg{ color:var(--success); }
  .act.info svg{ color:var(--accent); }
  .act .ago{ color:var(--text-muted); font-weight:400; margin-left:2px; }
  .c .flag{ display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c .flag svg{ width:12px; height:12px; flex-shrink:0; }
  .c .flag.warning{ color:var(--warning); }
  .c .flag.danger{ color:var(--danger); }
  .c .flag.muted{ color:var(--text-muted); font-weight:500; }
  .rowmenu{ width:28px; height:28px; border-radius:6px; border:none; background:none; display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; margin-left:auto; }
  .rowmenu svg{ width:16px; height:16px; }
  .rowmenu:hover{ background:var(--accent-bg); color:var(--accent); }
  .cmenu{ width:40px; flex-shrink:0; display:flex; justify-content:flex-end; }

  .empty{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:56px 20px; color:var(--text-muted); }
  .empty svg{ width:34px; height:34px; }
  .empty b{ font-size:15px; color:var(--text-secondary); }
  .empty span{ font-size:13px; }
  .empty .btn{ margin-top:8px; }

  .pager{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; font-size:13px; color:var(--text-muted); }
  .pager .btn{ padding:8px 14px; font-size:13px; }

  /* drawer */
  .scrim{ position:fixed; inset:0; background:rgba(30,26,20,.35); z-index:40; display:flex; justify-content:flex-end; }
  .scrim[hidden]{ display:none; }
  .drawer{ width:460px; max-width:92%; height:100%; background:var(--bg); border-left:1px solid var(--border); box-shadow:-12px 0 40px rgba(20,16,10,.18); display:flex; flex-direction:column; }
  .dhead{ display:flex; align-items:center; gap:10px; padding:18px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  .dhead .t{ flex:1; min-width:0; }
  .dhead h2{ font-family:var(--font-display); font-weight:600; font-size:19px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dhead .s{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .dhead .s b{ font-family:var(--font-mono); font-weight:500; color:var(--text-secondary); }
  .dclose{ width:28px; height:28px; border-radius:6px; border:none; background:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .dclose:hover{ background:var(--surface-sunken); color:var(--text-primary); }
  .dclose svg{ width:18px; height:18px; }
  .dbody{ flex:1; overflow:auto; padding:20px 24px; display:flex; flex-direction:column; gap:16px; }
  .dfoot{ display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border); background:var(--surface); position:relative; }
  .dfoot .btn{ flex:1; justify-content:center; }
  .timeline{ background:var(--accent-bg); border-left:3px solid var(--accent); border-radius:10px; padding:14px 16px; }
  .timeline .h{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
  .steps{ display:flex; align-items:flex-start; gap:4px; }
  .step{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; }
  .step .dot{ width:14px; height:14px; border-radius:999px; border:2px solid var(--border-strong); background:var(--surface); margin-bottom:6px; z-index:1; }
  .step.on .dot{ border-color:var(--step); background:var(--step); }
  .step .sl{ font-size:12px; font-weight:500; color:var(--text-muted); }
  .step.on .sl{ color:var(--text-primary); font-weight:600; }
  .step .st{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-top:2px; }
  .step .st.hl{ color:var(--warning); }
  .step .conn{ position:absolute; top:6px; left:60%; right:-40%; height:2px; background:var(--border); }
  .step.conn-on .conn{ background:var(--accent); }
  .bigmoney{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .bigmoney .k{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
  .bigmoney .v{ font-family:var(--font-mono); font-weight:700; font-size:26px; line-height:1; }
  .bigmoney .v.danger{ color:var(--danger); }
  .bigmoney .v.success{ color:var(--success); }
  .bigmoney .of{ font-size:12.5px; color:var(--text-secondary); margin-top:6px; }
  .bigmoney .due{ text-align:right; font-size:12.5px; color:var(--text-secondary); }
  .bigmoney .due b{ display:block; font-size:13.5px; color:var(--text-primary); }
  .bigmoney .due b.danger{ color:var(--danger); }
  .bigmoney .due b.warning{ color:var(--warning); }
  .agrid{ display:flex; flex-wrap:wrap; gap:10px; }
  .atile{ flex:1 1 47%; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; background:var(--surface-sunken); border:1px solid var(--border); font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text-primary); cursor:pointer; text-align:left; }
  .atile:hover{ background:var(--accent-bg); }
  .atile svg{ width:17px; height:17px; color:var(--accent); flex-shrink:0; }
  .atile.success{ border-color:#BFE3CC; color:var(--success); }
  .atile.success svg{ color:var(--success); }
  .atile.accentf{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .atile.accentf svg{ color:#fff; }
  .atile.accentf:hover{ background:var(--accent-hover); }
  .atile.danger{ border-color:#EFC9C6; color:var(--danger); }
  .atile.danger svg{ color:var(--danger); }
  .atile.wide{ flex-basis:100%; }
  .drow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0; }
  .drow .k{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }
  .drow .v{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--text-primary); text-align:right; min-width:0; }
  .drow .v svg{ width:14px; height:14px; color:var(--text-muted); flex-shrink:0; }
  .drow .v a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .drow .v a:hover{ text-decoration:underline; }
  .dsec{ display:flex; flex-direction:column; gap:8px; }
  .dsec .k{ display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }
  .dsec .k button{ border:none; background:none; font-family:inherit; font-size:12px; font-weight:600; color:var(--accent); cursor:pointer; text-transform:none; letter-spacing:0; display:inline-flex; align-items:center; gap:4px; padding:0; }
  .dsec .k button svg{ width:13px; height:13px; }
  .fu{ display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .fu.due{ border-color:#F1D9B8; background:var(--warning-bg); }
  .fu input[type=checkbox]{ margin-top:2px; accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
  .fu .n{ flex:1; font-size:13.5px; color:var(--text-primary); }
  .fu .n.done{ text-decoration:line-through; color:var(--text-muted); }
  .fu .w{ font-size:11.5px; font-weight:600; margin-top:2px; }
  .fu .w.warning{ color:var(--warning); }
  .fu .w.muted{ color:var(--text-muted); font-weight:500; }
  .fu .w.danger{ color:var(--danger); }
  .dempty{ font-size:13px; color:var(--text-muted); }
  .pay{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; }
  .pay svg{ width:15px; height:15px; color:var(--success); flex-shrink:0; }
  .pay .m{ font-family:var(--font-mono); font-weight:600; margin-left:auto; }
  .pay .d{ color:var(--text-muted); }
  .form{ background:var(--surface); border:1px solid var(--border-strong); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .form .fr{ display:flex; gap:10px; }
  .form label{ flex:1; display:flex; flex-direction:column; gap:4px; font-size:11.5px; font-weight:600; color:var(--text-secondary); }

const daysAgo = (iso) => -daysUntil(iso);
const ago = (iso) => { if (!iso) return ''; const ms = NOW - new Date(iso).getTime(); const m = Math.floor(ms/60000); if (m < 1) return 'just now'; if (m < 60) return m + 'm ago'; const h = Math.floor(m/60); if (h < 24) return h + 'h ago'; const d = Math.floor(h/24); if (d === 1) return 'yesterday'; if (d < 30) return d + 'd ago'; return fmtD(iso); };
const fmtD = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU', { day:'numeric', month:'short' }) : '—';
const fmtDY = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—';
const dueWords = (iso) => { const d = daysUntil(iso); if (d < 0) return { cls:'danger', text:`Overdue ${-d} day${-d===1?'':'s'}` }; if (d === 0) return { cls:'warning', text:'Due today' }; if (d === 1) return { cls:'warning', text:'Due tomorrow' }; if (d <= 3) return { cls:'warning', text:`Due in ${d} days` }; return { cls:'', text:`Due ${fmtD(iso)}` }; };
const sameMonth = (iso) => { const a = new Date(iso), b = new Date(NOW); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); };
const toast = $('#toast'); let toastT;
function say(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>toast.classList.remove('show'), 1800); }
function go(href){ say('→ ' + href); }
document.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); e.stopPropagation(); go(g.dataset.go); } });
const params = new URLSearchParams(location.search);


const LIB = Object.fromEntries(D.LIBRARY.map(x => [x.id, x]));
const PROD = Object.fromEntries(D.PRODUCTS.map(x => [x.id, x]));
const TASK = Object.fromEntries(D.TASKS.map(x => [x.id, x]));
const CUST = Object.fromEntries(D.CUSTOMERS.map(x => [x.id, x]));
const UNIT = { m2:'m²', lineal:'lm', each:'ea', hour:'hr', job:'job', day:'day' };
const KIND_LABEL = { labour:'Labour', material:'Material', equipment:'Equipment', trade:'Trade' };
const HZ = { refer:'Refer out', we_do:'We do it', subcontract:'Subcontracted' };
const r2 = (n) => Math.round((+n || 0) * 100) / 100;
const money = (n) => '$' + (Math.round((+n || 0) * 100) / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qfmt = (n) => (n === null || n === undefined || isNaN(n)) ? '' : (Math.round(n * 10) / 10).toString();
const hfmt = (h) => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m/60)}h${m%60 ? ' ' + (m%60) + 'm' : ''}` : `${m}m`; };

// ---- area maths (metres in, metres out) ----
const areaCalc = (a) => { const w = +a.w || 0, l = +a.l || 0, h = +a.h || 0; return { walls: r2(2 * (w + l) * h), ceiling: r2(w * l), floor: r2(w * l), linear: r2(2 * (w + l)) }; };
const measured = (a) => !!a && (+a.w > 0) && (+a.l > 0) && (+a.h > 0);
const needsDims = (li) => li.kind === 'library' && li.qty_auto && (li.unit === 'm2' || li.unit === 'lineal');
function autoQty(li, area){
  if (!area || !measured(area)) return 0;
  const c = areaCalc(area); const lib = LIB[li.lib_id]; const cat = (lib?.category || '').toLowerCase();
  if (li.unit === 'm2') return /ceiling/.test(cat) ? c.ceiling : c.walls;
  if (li.unit === 'lineal') return c.linear;
  return 1;
}
// ---- line maths ----
function libRate(li){ const lib = LIB[li.lib_id]; if (!lib) return 0; if (lib.priced_by === 'hour') return lib.rates.c1 || 0; const r = lib.rates; const coat = li.coats === 1 ? r.c1 : li.coats === 3 ? r.c3 : r.c2; if (coat === null || coat === undefined) return 0; return r2((coat || 0) + (li.primer ? (r.primer || 0) : 0) + (li.prep ? (lib.prep_rate || 0) : 0)); }
function libMins(li){ const lib = LIB[li.lib_id]; if (!lib) return 0; if (lib.priced_by === 'hour') return 60; const m = lib.mins; const coat = li.coats === 1 ? m.c1 : li.coats === 3 ? m.c3 : m.c2; return (coat || 0) + (li.primer ? (m.primer || 0) : 0) + (li.prep ? (lib.prep_mins || 0) : 0); }
function unpriced(li){ const lib = LIB[li.lib_id]; if (!lib) return false; if (lib.priced_by === 'hour') return !lib.rates.c1; const r = lib.rates; const coat = li.coats === 1 ? r.c1 : li.coats === 3 ? r.c3 : r.c2; return coat === null || coat === undefined; }
function lineQty(li, est){ if (li.kind === 'library' && li.qty_auto) return autoQty(li, est.areas.find(a => a.id === li.area_id)); return +li.qty || 0; }
function lineRate(li){
  if (li.kind === 'library') return li.rate_override ?? libRate(li);
  if (li.kind === 'repair'){ const t = TASK[li.task_id]; if (li.hazard && (li.hazard_mode || 'refer') === 'refer') return 0; if (li.hazard && li.hazard_mode === 'subcontract') return r2((+li.sub_cost || 0) * (1 + (+li.markup_pct || 0) / 100)); return li.rate_override ?? (t?.rate || 0); }
  if (li.category === 'trade') return r2((+li.sub_cost || 0) * (1 + (+li.markup_pct || 0) / 100));
  return +li.rate || 0;
}
function lineTotal(li, est){ return r2(lineQty(li, est) * lineRate(li)); }
function lineHours(li, est){
  const q = lineQty(li, est);
  if (li.kind === 'library') return r2(q * libMins(li) / 60);
  if (li.kind === 'repair'){ if (li.hazard && (li.hazard_mode || 'refer') !== 'we_do') return 0; return r2(q * (TASK[li.task_id]?.mins || 0) / 60); }
  return r2(+li.hours || 0);
}
function lineMeta(li, est){
  const bits = [];
  if (li.kind === 'library'){ const lib = LIB[li.lib_id]; if (lib?.priced_by === 'hour') bits.push('hourly'); else { if (li.prep) bits.push('Prep'); if (li.primer) bits.push('Prime'); bits.push(`${li.coats} coat${li.coats === 1 ? '' : 's'}`); } if (li.product && PROD[li.product]) { bits.push(`${PROD[li.product].brand} ${PROD[li.product].name}`); if (li.colour) bits.push(esc(li.colour)); } const h = lineHours(li, est); if (h) bits.push(hfmt(h)); }
  else if (li.kind === 'repair'){ const t = TASK[li.task_id]; if (li.hazard) bits.push(`<b>${HZ[li.hazard_mode || 'refer']}</b>`); else { bits.push(t?.group || 'Repair'); const h = lineHours(li, est); if (h) bits.push(hfmt(h)); } }
  else { if (li.category === 'trade') bits.push(`sub-quote ${money(li.sub_cost)} + ${li.markup_pct}%`); else if (li.category === 'material' && li.product && PROD[li.product]) bits.push(PROD[li.product].pack); else if (li.hours) bits.push(hfmt(li.hours)); }
  return bits.join(' · ') + (li.notes ? `<div class="lnote">${svg('note')}${esc(li.notes)}${li.note_show_on_quote ? '<span class="onq">on the quote</span>' : ''}</div>` : '');
}
function displayUnit(li){ return UNIT[li.unit] || li.unit; }
function lineKindClass(li){ return li.kind === 'repair' ? 'repair' : li.kind === 'custom' ? li.category : 'library'; }
function clientKind(li){ if (li.kind === 'repair') return 'labour'; if (li.kind === 'custom') return li.category === 'material' ? 'material' : 'labour'; return 'labour'; }

// ---- estimate totals ----
function totals(est, selected){
  const sel = selected || new Set(est.accepted_options || []);
  const live = est.lines.filter(li => !li.optional || sel.has(li.id));
  const subtotal = r2(live.reduce((s, li) => s + lineTotal(li, est), 0));
  const optional = r2(est.lines.filter(li => li.optional && !sel.has(li.id)).reduce((s, li) => s + lineTotal(li, est), 0));
  const hours = r2(live.reduce((s, li) => s + lineHours(li, est), 0));
  const d = est.discount || {}; const discount = !d.enabled ? 0 : d.type === 'percent' ? r2(subtotal * (+d.value || 0) / 100) : Math.min(r2(+d.value || 0), subtotal);
  const base = r2(subtotal - discount);
  const tax = est.tax?.enabled ? r2(base * (+est.tax.rate || 0) / 100) : 0;
  return { subtotal, optional, hours, discount, base, tax, total: r2(base + tax) };
}
// ---- readiness checklist (the rail) ----
function checklist(est, cust){
  const out = [];
  est.areas.forEach(a => { const auto = est.lines.filter(li => li.area_id === a.id && needsDims(li)); if (auto.length && !measured(a)) out.push({ lvl:'red', text:`${a.name} isn't measured`, act:'measure', id:a.id }); });
  est.lines.filter(li => !li.optional).forEach(li => { if (li.kind === 'library' && unpriced(li) && li.rate_override === null) out.push({ lvl:'red', text:`${li.name.split(' · ').pop()} has no price`, act:'line', id:li.id }); else if (lineTotal(li, est) === 0 && !(li.kind === 'repair' && li.hazard) && !needsDims(li)) out.push({ lvl:'red', text:`${li.name} totals $0`, act:'line', id:li.id }); });
  if (!cust) out.push({ lvl:'red', text:'No client on this estimate', act:'contact' });
  else if (!cust.email) out.push({ lvl:'red', text:`Add ${cust.name.split(' ')[0]}'s email to send`, act:'contact' });
  if (!est.job.address) out.push({ lvl:'red', text:'No job address', act:'address' });
  if (!est.job.start_date) out.push({ lvl:'amber', text:'No start date on the quote', act:'job' });
  const noCol = est.lines.filter(li => !li.optional && li.kind === 'library' && li.product && !li.colour);
  if (noCol.length) out.push({ lvl:'amber', text:`${noCol.length} line${noCol.length === 1 ? ' has' : 's have'} no colour chosen`, act:'line', id: noCol[0].id });
  if (!(est.photos || []).length) out.push({ lvl:'amber', text:'No photos attached', act:'photos' });
  if (est.lines.some(li => li.kind === 'repair' && li.hazard && !li.hazard_mode)) out.push({ lvl:'amber', text:'Hazard found: choose refer / we do / subcontract', act:'line', id: est.lines.find(li => li.kind === 'repair' && li.hazard && !li.hazard_mode).id });
  out.push({ lvl:'ok', text:`${est.tax.label} ${est.tax.rate}% applied` });
  out.push({ lvl:'ok', text:'Terms and payment schedule from Settings' });
  return out;
}

// ---- the ONE client renderer: builder preview and public page both call this ----
function renderClientDoc(est, cust, biz, opts = {}){
  const sel = opts.selected || new Set(est.accepted_options || []);
  const t = totals(est, sel);
  const areaOf = (id) => est.areas.find(a => a.id === id);
  const live = est.lines.filter(li => !li.optional || sel.has(li.id));
  const labour = live.filter(li => clientKind(li) === 'labour' && !(li.kind === 'repair' && li.hazard && (li.hazard_mode || 'refer') === 'refer'));
  const materials = live.filter(li => clientKind(li) === 'material');
  const optional = est.lines.filter(li => li.optional && !sel.has(li.id));
  const chosen = est.lines.filter(li => li.optional && sel.has(li.id));
  const hazards = est.lines.filter(li => li.kind === 'repair' && li.hazard);
  const groups = [...est.areas.map(a => ({ a, rows: labour.filter(li => li.area_id === a.id) })).filter(g => g.rows.length), { a: null, rows: labour.filter(li => !li.area_id) }].filter(g => g.rows.length);
  const row = (li) => { const q = lineQty(li, est), r = lineRate(li), tot = lineTotal(li, est); const sub = [li.kind === 'library' ? (LIB[li.lib_id]?.priced_by === 'hour' ? 'hourly' : [li.prep ? 'prep' : null, li.primer ? 'prime' : null, `${li.coats} coat${li.coats===1?'':'s'}`].filter(Boolean).join(' · ')) : li.kind === 'repair' ? 'repair' : (li.category === 'trade' ? 'trade' : li.category === 'equipment' ? 'equipment' : null), li.note_show_on_quote && li.notes ? esc(li.notes) : null].filter(Boolean).join(' · ');
    return `<tr><td class="nm">${esc(li.name)}${sub ? `<span class="sub">${sub}</span>` : ''}</td><td class="c">${qfmt(q)}</td><td class="c">${displayUnit(li)}</td><td class="r">${money(r)}</td><td class="r">${money(tot)}</td></tr>`; };
  const arow = (a, rows) => { const c = a ? areaCalc(a) : null; const tot = rows.reduce((s, li) => s + lineTotal(li, est), 0); return `<tr class="arow"><td colspan="4">${a ? esc(a.name) : 'Whole job'}${a && measured(a) ? `<span class="ad">${a.w} × ${a.l} × ${a.h} m</span>` : ''}${a && a.note_show_on_quote && a.notes ? `<span class="an">${esc(a.notes)}</span>` : ''}</td><td class="r">${money(tot)}</td></tr>`; };
  const table = (title, body, total) => `<div class="sec"><div class="tbl-title">${title}<span>${money(total)}</span></div><table><thead><tr><th style="width:46%">Description</th><th style="width:10%;text-align:center">Qty</th><th style="width:10%;text-align:center">Unit</th><th class="r" style="width:16%">Rate</th><th class="r" style="width:18%">Amount</th></tr></thead><tbody>${body}</tbody></table></div>`;
  const status = est.status;
  const validUntil = new Date(NOW + (biz.validity_days || 30) * DAY).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
  const issued = new Date(NOW + (est.createdAt || 0) * DAY).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
  const site = est.job.address ? `${est.job.address}, ${[est.job.suburb, est.job.state, est.job.postcode].filter(Boolean).join(' ')}` : '—';
  const custLines = cust ? [cust.address ? `${cust.address}, ${[cust.suburb, cust.state, cust.postcode].filter(Boolean).join(' ')}` : null, cust.phone, cust.email].filter(Boolean) : [];
  const stars = '★★★★★';
  let h = '';
  if (status === 'accepted') h += `<div class="accepted">${svg('checkc')}Accepted by ${esc(est.signer_name || cust?.name || '')} on ${fmtDY(est.accepted_at)}. Thank you!</div>`;
  if (status === 'declined') h += `<div class="accepted declined">${svg('xc')}Declined on ${fmtDY(est.declined_at)}${est.decline_reason ? ` · “${esc(est.decline_reason)}”` : ''}.</div>`;
  h += `<div class="hdr"><div><h1>${esc(biz.business_name)}</h1><div class="bl">${esc(biz.abn)}<br>${esc(biz.address)}<br>${esc(biz.phone)} · ${esc(biz.email)}</div></div>
    <div class="doc"><div class="title">QUOTE</div><div class="kv">Quote #<b>${esc(est.estimate_number || 'Draft')}</b></div><div class="kv">Date issued<b>${issued}</b></div><div class="kv">Valid until<b>${validUntil}</b></div></div></div>`;
  h += `<div class="sec about"><div style="flex:1.3"><div class="tag">About us</div><p>${esc(biz.about_us)}</p></div><div class="stats">${biz.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div></div>`;
  h += `<div class="sec info"><div class="card"><div class="tag">Prepared for</div><div class="name">${esc(cust?.name || '—')}</div>${custLines.map(l => `<div class="line">${esc(l)}</div>`).join('')}</div>
    <div class="card soft"><div class="tag">Job details</div><div class="kv"><span class="k">Site</span><span>${esc(site)}</span></div>${est.job.est_duration ? `<div class="kv"><span class="k">Duration</span><span>${esc(est.job.est_duration)}</span></div>` : ''}${est.job.start_date ? `<div class="kv"><span class="k">Start</span><span>${esc(est.job.start_date)}</span></div>` : ''}</div></div>`;
  h += table('WHAT WE WILL DO', groups.map(g => arow(g.a, g.rows) + g.rows.map(row).join('')).join(''), labour.reduce((s, li) => s + lineTotal(li, est), 0));
  if (materials.length) h += table('MATERIALS SUPPLIED', materials.map(row).join(''), materials.reduce((s, li) => s + lineTotal(li, est), 0));
  const optRow = (li) => { const a = areaOf(li.area_id); const on = sel.has(li.id); return `<tr class="${on ? 'chosen' : ''}"><td class="nm">${opts.selectable ? `<label class="optpick"><input type="checkbox" data-optsel="${li.id}" ${on ? 'checked' : ''}> ` : ''}${esc(li.name)}${opts.selectable ? '</label>' : ''}<span class="sub">${a ? esc(a.name) + ' · ' : ''}${li.note_show_on_quote && li.notes ? esc(li.notes) : (on ? 'added to your quote' : 'optional')}</span></td><td class="c">${qfmt(lineQty(li, est))}</td><td class="c">${displayUnit(li)}</td><td class="r">${money(lineRate(li))}</td><td class="r">${on ? '' : '+ '}${money(lineTotal(li, est))}</td></tr>`; };
  const allOpt = est.lines.filter(li => li.optional);
  if (allOpt.length) h += `<div class="sec"><div class="tbl-title">OPTIONAL EXTRAS<span>${optional.length ? '+ ' + money(optional.reduce((s, li) => s + lineTotal(li, est), 0)) : 'all added'}</span></div><table><tbody>${allOpt.map(optRow).join('')}</tbody></table><p class="optnote">${opts.selectable ? 'Tick any extra to add it. The total below updates straight away and your choice is recorded when you accept.' : chosen.length ? `${chosen.length} extra${chosen.length === 1 ? '' : 's'} chosen by the client and included in the total.` : 'Not included in the total below. The client can add these when accepting online.'}</p></div>`;
  const prodRows = (() => { const seen = new Map(); est.lines.filter(li => (!li.optional || sel.has(li.id)) && li.kind === 'library' && li.product && PROD[li.product]).forEach(li => { const p = PROD[li.product]; const a = areaOf(li.area_id); const key = `${li.product}|${li.colour || ''}`; if (!seen.has(key)) seen.set(key, { p, colour: li.colour || '', where: new Set(), surfaces: new Set() }); const r = seen.get(key); r.where.add(a ? a.name : 'Whole job'); r.surfaces.add(LIB[li.lib_id]?.category || ''); }); return [...seen.values()]; })();
  if (prodRows.length) h += `<div class="sec"><div class="tag">Products and colours</div><table style="margin-top:6px"><thead><tr><th style="width:38%">Product</th><th style="width:22%">Colour</th><th style="width:20%">Surface</th><th style="width:20%">Where</th></tr></thead><tbody>${prodRows.map(r => `<tr><td class="nm">${esc(r.p.brand)} ${esc(r.p.name)}</td><td>${r.colour ? esc(r.colour) : '<span style="color:#6B6479">To be confirmed</span>'}</td><td>${esc([...r.surfaces].join(', '))}</td><td>${esc([...r.where].join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
  if (hazards.length) h += `<div class="hz"><div class="tag">Hazard disclosures</div>${hazards.map(li => { const tk = TASK[li.task_id]; const a = areaOf(li.area_id); const mode = li.hazard_mode || 'refer'; const txt = mode === 'we_do' ? `Includes licensed treatment of ${tk.name.toLowerCase()}. ${tk.stop_work}` : mode === 'subcontract' ? `${tk.name} handled by a licensed contractor. ${tk.stop_work}` : `${tk.name}: not included. Testing required before preparation. ${tk.stop_work}`; return `<div class="item"><b>${esc(tk.name)}</b><span class="mode">${HZ[mode]}</span>${a ? ` <span style="color:#6B6479">· ${esc(a.name)}</span>` : ''}<div class="txt">${esc(txt)}</div></div>`; }).join('')}<div class="txt" style="margin-top:8px">Disclosed so it can be accepted in writing. Licensing requirements vary by state and material.</div></div>`;
  h += `<div class="sec"><div class="totals"><div class="row"><span>Subtotal</span><span class="v">${money(t.subtotal)}</span></div>${t.discount ? `<div class="row"><span>Discount${est.discount.reason ? ` · ${esc(est.discount.reason)}` : ''}${est.discount.type === 'percent' ? ` (${est.discount.value}%)` : ''}</span><span class="v">−${money(t.discount)}</span></div>` : ''}${t.tax ? `<div class="row"><span>${esc(est.tax.label)} (${est.tax.rate}%)</span><span class="v">${money(t.tax)}</span></div>` : ''}<div class="grand"><span class="l">Total (AUD)</span><span class="v">${money(t.total)}</span></div></div></div>`;
  h += `<div class="sec"><div class="tag">Terms & conditions</div><div class="terms">${biz.terms.map((x, i) => `<div class="term"><span class="t">${i+1}. ${esc(x[0])}</span><span class="d">${esc(x[1])}</span></div>`).join('')}</div></div>`;
  h += `<div class="sec paybank"><div class="pay"><div class="tag">Payment terms</div><p class="intro">Payment is split across milestones so the commitment is easy to manage across the life of the job. Amounts assume the quoted total; variations shift each milestone proportionally.</p>${(est.payment_plan ? est.payment_plan.stages : biz.milestones).map(m => `<div class="ms"><span class="l">${esc(m.label)}</span><span class="p">${m.pct}%&nbsp;&nbsp;${money(t.total * m.pct / 100)}</span></div>`).join('')}</div><div class="bank"><div class="hd">BANK DETAILS</div><div class="rows"><div class="row"><span class="k">Account name</span><span>${esc(biz.bank.account_name)}</span></div><div class="row"><span class="k">BSB</span><span>${esc(biz.bank.bsb)}</span></div><div class="row"><span class="k">Account no.</span><span>${esc(biz.bank.acc_no)}</span></div><div class="row"><span class="k">Reference</span><span>${esc(est.estimate_number || '')}</span></div></div></div></div>`;
  h += `<div class="thanks"><div class="big">${esc(biz.footer_text)}</div><div class="sub">Questions? Call ${esc(biz.phone)} or email ${esc(biz.email)}.</div></div>`;
  if (est.presentation_enabled) h += `<div class="pres"><div class="tag">Recent work</div><p style="font-size:12.5px;color:#3B3548;margin:6px 0 0">A few examples from recent jobs similar in scope to yours.</p><div class="gal"><div></div><div></div><div></div></div><div class="reviews"><div class="rating">${biz.reviews.rating.toFixed(1)}</div><div><div class="stars">${stars}</div><div class="n">${biz.reviews.count} Google reviews</div></div></div></div>`;
  return h;
}

const STATE = params.get('state') || 'draft';
const clone = (o) => JSON.parse(JSON.stringify(o));

  if (id === 'discClear'){ est.discount = { enabled:false, type:'percent', value:0, reason:'' }; discOpen = false; changed(); return; }
  // sheet
  if (id === 'shClose' || id === 'shDone'){ closeSheet(); return; }
  if ((x = c('[data-tab]')) && sheet){ sheet.tab = x.dataset.tab; sheet.q = ''; renderSheet(); return; }
  if ((x = c('[data-cat]')) && sheet){ sheet.cat = x.dataset.cat; renderSheet(); return; }
  if ((x = c('[data-addlib]'))){ addLibrary(x.dataset.addlib); return; }
  if ((x = c('[data-addtask]'))){ addTask(x.dataset.addtask); return; }
  if ((x = c('[data-libdetail]'))){ openPanel(null, newLibraryLine(LIB[x.dataset.libdetail], sheet.areaId)); return; }
  if ((x = c('[data-kind]')) && sheet){ readCustomForm(); sheet.custom.category = x.dataset.kind; if (x.dataset.kind === 'trade') sheet.custom.unit = 'job'; renderSheet(); return; }
  if ((x = c('[data-prod]')) && sheet){ readCustomForm(); const p = PROD[x.dataset.prod]; sheet.custom.product = p.id; sheet.custom.name = `${p.brand} ${p.name} ${p.pack}`; sheet.custom.rate = p.unit_cost; renderSheet(); return; }
  if (id === 'cu_add'){ addCustom(); return; }
  // panel
  if (id === 'plClose'){ closePanel(); return; }
  if (id === 'pl_save'){ savePanel(); return; }
  if (id === 'pl_delete'){ const li = lineById(panel.line.id); const idx = est.lines.indexOf(li); est.lines.splice(idx, 1); closePanel(); changed(); showUndo(`${li.name} deleted`, () => { est.lines.splice(idx, 0, li); changed(); }); return; }
  if (id === 'pl_photo'){ readPanel(); if (panel.isNew){ say('Add the line first, then attach a photo from its row'); return; } const lid = panel.line.id; const i = est.lines.findIndex(o => o.id === lid); est.lines[i] = panel.line; closePanel(); openPhotos({ line_id: lid }); return; }
  if (id === 'pl_clearov'){ readPanel(); panel.line.rate_override = null; renderPanel(); return; }
  if ((x = c('[data-qmode]'))){ readPanel(); panel.line.qty_auto = x.dataset.qmode === 'auto'; if (!panel.line.qty_auto) panel.line.qty = lineQty(panel.line, est); else panel.line.qty = null; renderPanel(); return; }
  if ((x = c('[data-plprod]'))){ readPanel(); panel.line.product = x.dataset.plprod || null; renderPanel(); return; }
  if ((x = c('[data-applyprod]'))){ readPanel(); const li = panel.line; const cat = LIB[li.lib_id].category; const scope = x.dataset.applyprod; let n = 0; est.lines.forEach(o => { if (o.id === li.id || o.kind !== 'library' || LIB[o.lib_id].category !== cat) return; if (scope === 'area' && (o.area_id || null) !== (li.area_id || null)) return; o.product = li.product; o.colour = li.colour; n++; }); if (!panel.isNew){ const i = est.lines.findIndex(o => o.id === li.id); est.lines[i] = li; } changed(); say(n ? `Applied to ${n} other ${cat.toLowerCase()} line${n === 1 ? '' : 's'}` : `No other ${cat.toLowerCase()} lines to apply to`); renderPanel(); return; }
  if ((x = c('[data-hz]'))){ readPanel(); panel.line.hazard_mode = x.dataset.hz; renderPanel(); return; }
  if ((x = c('[data-plkind]'))){ readPanel(); panel.line.category = x.dataset.plkind; if (x.dataset.plkind === 'trade') panel.line.unit = 'job'; renderPanel(); return; }
});
function readCustomForm(){ if (!sheet || sheet.tab !== 'custom' || !$('#cu_name')) return; const c = sheet.custom; c.name = $('#cu_name').value; c.qty = +$('#cu_qty').value || 1; c.unit = $('#cu_unit').value; if ($('#cu_rate')) c.rate = +$('#cu_rate').value || 0; if ($('#cu_sub')) c.sub_cost = +$('#cu_sub').value || 0; if ($('#cu_markup')) c.markup_pct = +$('#cu_markup').value || 0; if ($('#cu_hours')) c.hours = +$('#cu_hours').value || 0; c.notes = $('#cu_note').value; c.note_show_on_quote = $('#cu_show').checked; }
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-coat]') && panel){ readPanel(); const k = t.dataset.coat; if (k === 'prep') panel.line.prep = t.checked; else if (k === 'primer') panel.line.primer = t.checked; else panel.line.coats = +k[1]; renderPanel(); return; }
  if (t.matches('#pl_qty, #pl_rate, #pl_sub, #pl_markup, #pl_override, #pl_unit, #pl_hours, #pl_area, #pl_opt, #pl_colour, [data-srate], [data-smins]') && panel){ readPanel(); refreshPanelFoot(); return; }
  if (t.id === 'shArea' && sheet){ sheet.areaId = t.value || null; sheet.added = {}; renderSheet(); return; }
  if (t.matches('#cu_unit, #cu_sub, #cu_markup, #cu_rate') && sheet){ readCustomForm(); const c = sheet.custom; const lab = $('#sheet label[for=cu_rate], #cu_rate')?.previousElementSibling; if (lab) lab.textContent = `Rate $ per ${UNIT[c.unit]}`; const prev = $('#cu_preview'); if (prev) prev.textContent = `${money(r2((+c.sub_cost || 0) * (1 + (+c.markup_pct || 0) / 100)))} per ${UNIT[c.unit]}`; return; }
  if (t.matches('[data-q]')){ const li = lineById(t.dataset.q); const v = t.value.trim(); if (v === ''){ if (needsDims(li)) { li.qty_auto = true; li.qty = null; } } else { li.qty_auto = false; li.qty = +v || 0; } changed(true); return; }
  if (t.matches('[data-r]')){ const li = lineById(t.dataset.r); const v = t.value.replace(/[^0-9.]/g, ''); if (li.kind === 'library') li.rate_override = v === '' ? null : +v; else if (li.kind === 'repair') li.rate_override = v === '' ? null : +v; else li.rate = +v || 0; changed(true); return; }
  if (t.matches('[data-dim]')){ const wrap = t.closest('[data-dims]'); const a = areaById(wrap.dataset.dims); a[t.dataset.dim] = +t.value || 0; changed(true); if (sheet && (!t.closest('#sheet') || measured(a))) renderSheet(); return; }
  if (t.matches('[data-aname]')){ const a = areaById(t.dataset.aname); a.name = t.value.trim() || a.name; changed(true); return; }
});
document.addEventListener('input', (e) => { const t = e.target; if (t.id === 'pl_prodq' && panel){ readPanel(); panel.prodq = t.value; const pos = t.selectionStart; renderPanel(); const n = $('#pl_prodq'); n.focus(); n.setSelectionRange(pos, pos); n.scrollIntoView({ block:'center' }); return; } if (t.id === 'shq' && sheet){ sheet.q = t.value; const pos = t.selectionStart; renderSheet(); const n = $('#shq'); n.focus(); n.setSelectionRange(pos, pos); } if (t.id === 'cq'){ const v = t.value; openContact({ change:true, q:v }); const n = $('#cq'); n.focus(); n.setSelectionRange(v.length, v.length); } });

// ---- Add work v2: one search, a rail, cards (declared after the original renderSheet, so it replaces it) ----
const SH_ICON = { library: 'layers', repair: 'wrench', custom: 'edit' };
function shLines(a){ return a ? est.lines.filter(l => l.area_id === a.id) : est.lines.filter(l => !l.area_id); }
function shCard(x, kind){
  if (kind === 'lib'){
    const np = x.priced_by === 'hour' ? !x.rates.c1 : x.rates.c2 === null; const rate = x.priced_by === 'hour' ? x.rates.c1 : x.rates.c2; const added = sheet.added[x.id]; const ph = LIB_PHOTO[x.name];
    return `<div class="lcard" data-testid="lib-row-${x.id}"><div class="th ${ph ? 'img' : ''}">${ph ? `<img src="library-photos/${ph}.webp" alt="" loading="lazy">` : svg('layers')}</div><div class="n" data-libdetail="${x.id}">${esc(x.name)}</div><div class="m">${np ? '<span class="np">No price yet</span>' : `${money(rate)}/${UNIT[x.priced_by]}`} · ${x.priced_by === 'hour' ? 'hourly' : '2 coats'}</div><div class="d">${esc(x.about)}</div><div class="foot"><button class="add ${added ? 'done' : ''}" data-addlib="${x.id}">${added ? svg('check') + 'Added' : svg('plus') + 'Add'}</button></div></div>`;
  }
  const t = x; const added = sheet.added[t.id];
  return `<div class="lcard" data-testid="task-row-${t.id}"><div class="th ${t.hazard ? 'hz' : 'rp'}">${svg(t.hazard ? 'warn' : 'wrench')}</div><div class="n">${esc(t.name)}</div><div class="m">${t.hazard ? 'Hazard flag' : `${money(t.rate)}/${UNIT[t.priced_by]} · ${t.mins} min`}</div><div class="d">${t.hazard ? 'You choose refer out, we do it, or subcontract' : esc(t.about || '')}</div><div class="foot"><button class="add ${added ? 'done' : ''}" data-addtask="${t.id}">${added ? svg('check') + 'Added' : svg('plus') + 'Add'}</button></div></div>`;
}
function renderSheet(){
  if (!sheet) return;
  if (sheet.rgroup === undefined) sheet.rgroup = 'All';
  const a = sheet.areaId ? areaById(sheet.areaId) : null;
  const areaOpts = `<select class="areasel" id="shArea">${est.areas.map(x => `<option value="${x.id}" ${x.id === sheet.areaId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`;
  const have = shLines(a); const shown = have.slice(0, 6);
  const onpaper = `<div class="onpaper" data-testid="sheet-on-paper">${have.length ? `On the paper: ${shown.map(l => `<span class="c">${esc(l.name)}</span>`).join('')}${have.length > 6 ? `<span>+${have.length - 6} more</span>` : ''}` : `Nothing in ${a ? esc(a.name) : 'the job'} yet.`}</div>`;
  const search = `<div class="sh-search">${svg('search')}<input id="shq" data-testid="sheet-search" placeholder="Search everything — walls, doors, cracks, mould, scaffold…" value="${esc(sheet.q)}"></div>`;
  const measureStrip = a && !measured(a) ? `<div class="measure" data-testid="measure-strip"><b>${esc(a.name)} has no measurements.</b> Enter them so m² and lineal quantities fill themselves.<div class="dims" data-dims="${a.id}"><label>W</label><input value="${a.w || ''}" data-dim="w" placeholder="0"><label>L</label><input value="${a.l || ''}" data-dim="l" placeholder="0"><label>H</label><input value="${a.h || ''}" data-dim="h" placeholder="0"><span class="u">m</span></div></div>` : '';
  // pools
  const side = sheetSide();
  const rank = (x) => !side || x.scope === 'both' || x.scope === side ? 0 : 1;
  const pool = libItemsForScope().slice().sort((p, q) => rank(p) - rank(q));
  const cats = [...new Set(pool.map(x => x.category))];
  const tgroups = [...new Set(D.TASKS.map(t => t.group))];
  const q = (sheet.q || '').trim().toLowerCase();
  const hit = (s) => s.toLowerCase().includes(q);
  // rail
  const railBtn = (tab, cat, label, n, icon) => `<button class="${!q && sheet.tab === tab && (tab === 'custom' || (tab === 'library' ? sheet.cat : sheet.rgroup) === cat) ? 'on' : ''}" data-nav="${tab}|${esc(cat)}" data-testid="nav-${tab}-${cat.toLowerCase().replace(/[^a-z]+/g, '-')}">${icon ? svg(icon) : ''}${esc(label)}${n !== undefined ? `<span class="n">${n}</span>` : ''}</button>`;
  const rail = `<div class="rail" data-testid="sheet-rail"><div class="lbl">Library</div>${railBtn('library', 'All', 'Everything', pool.length)}${cats.map(c => railBtn('library', c, c, pool.filter(x => x.category === c).length)).join('')}<div class="lbl">Repairs &amp; prep</div>${railBtn('repair', 'All', 'All repairs', D.TASKS.length)}${tgroups.map(g => railBtn('repair', g, g, D.TASKS.filter(t => t.group === g).length)).join('')}<div class="lbl">Anything else</div>${railBtn('custom', 'custom', 'Custom line', undefined, 'edit')}</div>`;
  // content
  let body = '';
  const grid = (items, kind) => `<div class="lgrid">${items.map(x => shCard(x, kind)).join('')}</div>`;
  if (q){
    const libs = pool.filter(x => hit(x.category + ' ' + x.name + ' ' + x.about));
    const tasks = D.TASKS.filter(t => hit(t.group + ' ' + t.name + ' ' + (t.about || '')));
    const lg = [...new Set(libs.map(x => x.category))];
    body = (libs.length ? lg.map(g => `<div class="lgrp">${esc(g)} <span class="n">${libs.filter(x => x.category === g).length}</span></div>${grid(libs.filter(x => x.category === g), 'lib')}`).join('') : '')
      + (tasks.length ? `<div class="lgrp">Repairs &amp; prep <span class="n">${tasks.length}</span></div>${grid(tasks, 'task')}` : '')
      + (!libs.length && !tasks.length ? `<div class="aempty">Nothing in the Library or Repairs matches “${esc(sheet.q)}”.</div>` : '')
      + `<div class="srchint" data-testid="search-custom">Not in the Library? <b>${esc(sheet.q)}</b> can be a custom line — labour, material, equipment or a trade's sub-quote.<button data-custom-from-search="1" data-testid="search-custom-btn">${svg('plus')}Add as a custom line</button></div>`;
  } else if (sheet.tab === 'library'){
    const items = pool.filter(x => sheet.cat === 'All' || x.category === sheet.cat);
    const groups = [...new Set(items.map(x => x.category))];
    const otherSideFrom = side ? groups.find(g => items.filter(x => x.category === g).every(x => rank(x) === 1)) : null;
    body = groups.map(g => `<div class="lgrp">${esc(g)} <span class="n">${items.filter(x => x.category === g).length}</span>${g === otherSideFrom ? `<span class="side" data-testid="sheet-other-side">${side === 'interior' ? 'Outside the house' : 'Inside the house'} — also in your Library</span>` : ''}</div>${grid(items.filter(x => x.category === g), 'lib')}`).join('')
      + `<div class="footnote">Rates and minutes come from your Library. Click a name to change coats, primer, prep or product before adding.</div>`;
  } else if (sheet.tab === 'repair'){
    const tasks = D.TASKS.filter(t => sheet.rgroup === 'All' || t.group === sheet.rgroup);
    const groups = [...new Set(tasks.map(t => t.group))];
    body = groups.map(g => `<div class="lgrp">${esc(g)} <span class="n">${tasks.filter(t => t.group === g).length}</span></div>${grid(tasks.filter(t => t.group === g), 'task')}`).join('')
      + `<div class="footnote">Repairs sit inside the ${areaNoun()} with the paint lines. Hazards print a disclosure on the quote.</div>`;
  } else {
    const c = sheet.custom; const isTrade = c.category === 'trade'; const isMat = c.category === 'material';
    const kinds = [['labour','Labour','hammer'],['material','Material','box'],['equipment','Equipment','truck'],['trade','Trade','users']].map(([k,l,i]) => `<button class="${c.category === k ? 'on' : ''}" data-kind="${k}" data-testid="kind-${k}">${svg(i)}${l}</button>`).join('');
    const price = isTrade ? r2((+c.sub_cost || 0) * (1 + (+c.markup_pct || 0) / 100)) : (+c.rate || 0);
    body = `<div class="form2">
      <div class="fld span"><label>Kind</label><div class="kinds">${kinds}</div><div class="hint">${isTrade ? 'A sub-quote from another trade, marked up and shown as one line.' : isMat ? 'Paint or sundries you supply, shown under Materials on the quote.' : c.category === 'equipment' ? 'Hire or plant, shown as a line the client can see.' : 'Anything you do that is not a Library item.'}</div></div>
      ${isMat ? `<div class="fld span"><label>From your Products</label><div class="chips" style="margin:0">${D.PRODUCTS.map(p => `<button class="chip ${c.product === p.id ? 'on' : ''}" data-prod="${p.id}">${esc(p.brand)} ${esc(p.name)} ${esc(p.pack)}</button>`).join('')}</div></div>` : ''}
      <div class="fld"><label>Description</label><input type="text" id="cu_name" data-testid="custom-name" value="${esc(c.name || '')}" placeholder="${isTrade ? 'e.g. Plasterer: patch and set east wall' : isMat ? 'e.g. Dulux Wash&Wear 10L' : c.category === 'equipment' ? 'e.g. Scaffold hire for stairwell' : 'e.g. Pressure wash driveway'}"></div>
      <div class="fr3"><div class="fld"><label>Qty</label><input type="number" id="cu_qty" value="${c.qty}"></div><div class="fld"><label>Unit</label><select id="cu_unit" data-testid="custom-unit">${['each','m2','lineal','hour','day','job'].map(u => `<option value="${u}" ${c.unit === u ? 'selected' : ''}>${UNIT[u]}</option>`).join('')}</select></div>
      ${isTrade ? `<div class="fld"><label>Sub-quote $</label><input type="number" id="cu_sub" value="${c.sub_cost || ''}" placeholder="0"></div>` : `<div class="fld"><label>Rate $ per ${UNIT[c.unit]}</label><input type="number" id="cu_rate" value="${c.rate || ''}" placeholder="0"></div>`}</div>
      ${isTrade ? `<div class="fld"><label>Markup %</label><input type="number" id="cu_markup" value="${c.markup_pct ?? 15}"></div><div class="fld"><label>Shown to client</label><div id="cu_preview" data-testid="trade-shown" style="font-family:var(--font-mono);font-weight:700;padding:8px 0">${money(price)} per ${UNIT[c.unit]}</div></div>` : ''}
      ${c.category === 'labour' ? `<div class="fld"><label>Labour hours (for scheduling, not shown)</label><input type="number" id="cu_hours" value="${c.hours || ''}" placeholder="0"></div>` : ''}
      <div class="fld ${c.category === 'labour' ? '' : 'span'}"><label>Note</label><input type="text" id="cu_note" value="${esc(c.notes || '')}" placeholder="Optional"><label class="cb" style="margin-top:6px;font-weight:500"><input type="checkbox" id="cu_show" data-testid="custom-show" ${c.note_show_on_quote ? 'checked' : ''}>Show the note on the quote</label></div>
    </div>`;
  }
  const foot = sheet.tab === 'custom' && !q ? `<div class="sh-foot"><span class="sum">Adds one line to ${a ? esc(a.name) : 'the whole job'}</span><button class="btn btn-primary" id="cu_add" data-testid="custom-add">${svg('plus')}Add line</button></div>`
    : `<div class="sh-foot"><span class="sum">${Object.keys(sheet.added).length ? `<b>${Object.keys(sheet.added).length}</b> added this session · quote now <b>${money(T().total)}</b>` : `Quote total <b>${money(T().total)}</b>`}</span><button class="btn btn-ghost" id="shDone" data-testid="sheet-done">Done</button></div>`;
  $('#sheet').innerHTML = `<div class="sh-head"><div class="row"><h2>Add work to ${areaOpts}</h2><button class="x" id="shClose">${svg('close')}</button></div>${onpaper}${search}</div><div class="sh-body">${rail}<div class="content" data-testid="sheet-content">${measureStrip}${body}</div></div>${foot}`;
}
document.addEventListener('click', (e) => {
  if (!sheet) return;
  const nav = e.target.closest('[data-nav]'); if (nav){ e.stopPropagation(); const [tab, cat] = nav.dataset.nav.split('|'); sheet.tab = tab; if (tab === 'library') sheet.cat = cat; if (tab === 'repair') sheet.rgroup = cat; sheet.q = ''; renderSheet(); return; }
  const cf = e.target.closest('[data-custom-from-search]'); if (cf){ e.stopPropagation(); sheet.custom.name = sheet.q.trim(); sheet.tab = 'custom'; sheet.q = ''; renderSheet(); $('#cu_name')?.focus(); return; }
}, true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ if (panel) closePanel(); else if (!$('#modal').hidden) closeModal(); else if (sheet) closeSheet(); else if (!$('#drawerwrap').hidden) $('#drawerwrap').hidden = true; closePop(); } if (e.key === 'Enter' && e.target.id === 'roomCustom'){ $('#roomAdd').click(); } if (e.key === 'Enter' && e.target.matches('[data-dim], [data-q], [data-r], [data-aname]')) e.target.blur(); });
$('#sheetwrap').addEventListener('click', (e) => { if (e.target === $('#sheetwrap')) closeSheet(); });
$('#panelwrap').addEventListener('click', (e) => { if (e.target === $('#panelwrap')) closePanel(); });
$('#drawerwrap').addEventListener('click', (e) => { if (e.target === $('#drawerwrap')) $('#drawerwrap').hidden = true; });
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });

// ============================================================ boot
(function(){ const t = params.get('type') || 'full'; if (t === 'exterior') est.estimate_type = 'Residential Exterior'; else if (t === 'full') est.estimate_type = 'Residential Full Repaint';
  const orphans = est.lines.filter(l => !l.area_id); if (orphans.length){ let site = est.areas.find(a => a.name === 'Site & setup'); if (!site){ site = { id: uid('a_'), name:'Site & setup', w:0, l:0, h:0, notes:'', note_show_on_quote:false }; est.areas.push(site); } orphans.forEach(l => l.area_id = site.id); } })();
render();
$('#savedtxt').textContent = est.estimate_number ? `Saved ${STATE === 'sent' ? '2 days ago' : '4 min ago'}` : 'Not saved yet';
if (STATE === 'new') openChooser();

</script>
