<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice builder — Paint Trade HQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Inter:wght@400..700&family=IBM+Plex+Mono:wght@400..700&display=swap');

  :root{
    /* ---- Color tokens ---- */
    --accent:        #4B3E86; /* Undercoat — primary accent, actions only */
    --accent-hover:  #5C4C9E;
    --accent-bg:     #F1EEFA; /* light tint for selected/AI surfaces */
    --accent-ink:    #34295E; /* darker text-on-tint variant */

    --success:       #1C8A4B; /* live / paid / accepted */
    --success-bg:    #E7F6ED;
    --warning:       #B45309; /* pending / due soon */
    --warning-bg:    #FCF0E1;
    --danger:        #C6382E; /* overdue / declined */
    --danger-bg:     #FBEAEA;

    --bg:            #FAF9F6;
    --surface:       #FFFFFF;
    --surface-sunken:#F4F2EE;
    --border:        #E7E3DA;
    --border-strong: #D8D3C7;

    --text-primary:  #1E1C1A;
    --text-secondary:#6B675F;
    --text-muted:    #9B968A;

    /* ---- Type ---- */
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

    /* ---- Spacing scale (base 4px) ---- */
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-6: 24px;
    --sp-8: 32px;
    --sp-12: 48px;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 2px rgba(30,28,26,0.04), 0 1px 8px rgba(30,28,26,0.03);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family: inherit; cursor:pointer; }
  ::selection{ background: var(--accent-bg); color: var(--accent-ink); }

  .app{ display:flex; min-height:100vh; }
  /* ================= SIDEBAR ================= */
  .sidebar{
    width: 260px;
    flex-shrink:0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding: var(--sp-6) var(--sp-4) var(--sp-4);
    position: sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: var(--sp-3);
    padding: 0 var(--sp-2);
    margin-bottom: var(--sp-8);
  }
  .brand-mark{
    width:34px; height:34px;
    border-radius: 9px;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-text{ line-height:1.2; }
  .brand-name{ font-family: var(--font-display); font-weight:600; font-size:16px; color: var(--text-primary); }
  .brand-sub{ font-size:11.5px; color: var(--text-muted); margin-top:1px; }

  .nav-group{ margin-bottom: var(--sp-6); }
  .nav-group-label{
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 0 var(--sp-2);
    margin-bottom: var(--sp-2);
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap: var(--sp-3);
    padding: 9px var(--sp-2);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 1px;
    transition: background .12s ease, color .12s ease;
    position:relative;
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background: var(--surface-sunken); color: var(--text-primary); }
  .nav-item.active{ background: var(--accent-bg); color: var(--accent-ink); font-weight:600; }
  .nav-item.active svg{ opacity:1; }
  .nav-item .pro{
    margin-left:auto;
    font-size:10px;
    font-weight:600;
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 5px;
    padding: 2px 6px;
    letter-spacing: .01em;
  }

  .sidebar-footer{
    margin-top:auto;
    padding-top: var(--sp-4);
    border-top: 1px solid var(--border);
    display:flex;
    align-items:center;
    gap: var(--sp-3);
    padding-left: var(--sp-2);
  }
  .sidebar-footer .avatar{
    width:32px; height:32px;
    border-radius:50%;
    background: var(--accent);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display);
    font-weight:600;
    font-size:13px;
    flex-shrink:0;
  }
  .sidebar-footer-name{ font-size:13.5px; font-weight:600; color: var(--text-primary); }
  .sidebar-footer-role{ font-size:11.5px; color: var(--text-muted); }
  
  /* ================= MAIN — shared Estimates / Invoices list layout ================= */
  main{ flex:1; min-width:0; padding:var(--sp-6) var(--sp-12) var(--sp-12); max-width:1360px; }
  .page-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .page-title{ font-family:var(--font-display); font-weight:600; font-size:27px; margin:0 0 4px; letter-spacing:-0.01em; }
  .page-sub{ font-size:13.5px; color:var(--text-muted); margin:0; max-width:620px; line-height:1.45; }
  .page-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn{ font-family:inherit; font-size:13.5px; font-weight:600; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border:1px solid transparent; white-space:nowrap; }
  .btn svg{ width:15px; height:15px; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:var(--surface); color:var(--text-primary); border-color:var(--border-strong); }
  .btn-ghost:hover{ background:var(--surface-sunken); }
  .btn-icon{ width:40px; height:40px; padding:0; justify-content:center; color:var(--accent); }
  .btn-icon svg{ width:18px; height:18px; }

  /* stat tiles — clickable filters */
  .stats{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:18px; }
  .stat{ text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:14px 16px 13px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:4px; transition:box-shadow .15s ease, border-color .15s ease, transform .15s ease; position:relative; }
  .stat:hover{ border-color:var(--accent); box-shadow:0 6px 20px rgba(30,28,26,0.09), 0 1px 3px rgba(30,28,26,0.06); transform:translateY(-2px); }
  .stat.active{ border-color:var(--accent); background:var(--accent-bg); }
  .stat .lbl{ display:flex; align-items:center; gap:7px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
  .stat .lbl svg{ width:14px; height:14px; }
  .stat .val{ font-family:var(--font-mono); font-weight:700; font-size:24px; color:var(--text-primary); line-height:1.1; margin-top:2px; }
  .stat .sub{ font-size:12px; color:var(--text-secondary); }
  .stat.danger .lbl{ color:var(--danger); }
  .stat.danger .val{ color:var(--danger); }
  .stat.danger.active{ border-color:var(--danger); background:var(--danger-bg); }
  .stat.success .lbl{ color:var(--success); }
  .stat.success.active{ border-color:var(--success); background:var(--success-bg); }
  .stat.warning .lbl{ color:var(--warning); }
  .stat.warning.active{ border-color:var(--warning); background:var(--warning-bg); }
  .stat .go{ position:absolute; right:12px; top:12px; color:var(--text-muted); opacity:0; transition:opacity .12s; }
  .stat .go svg{ width:14px; height:14px; }
  .stat:hover .go{ opacity:.7; }

  /* toolbar: attention view + status tabs + search */
  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .tab{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; border:none; background:none; font-family:inherit; font-size:13px; font-weight:500; color:var(--text-secondary); cursor:pointer; transition:background-color .12s, color .12s; }
  .tab:hover{ background:var(--surface-sunken); }
  .tab.active{ background:var(--accent-bg); color:var(--accent-ink); font-weight:600; }
  .tab .n{ font-family:var(--font-mono); font-weight:600; font-size:11px; color:var(--text-muted); background:var(--surface-sunken); padding:1px 6px; border-radius:999px; min-width:18px; text-align:center; }
  .tab.active .n{ color:var(--accent); background:#fff; }
  .tab.attn{ border:1px solid #F1D9B8; background:var(--warning-bg); color:#6B3F0A; font-weight:600; padding-left:9px; }
  .tab.attn svg{ width:14px; height:14px; color:var(--warning); }
  .tab.attn .n{ background:#F7E2C4; color:var(--warning); }
  .tab.attn.active{ background:var(--warning); border-color:var(--warning); color:#fff; }
  .tab.attn.active svg{ color:#fff; }
  .tab.attn.active .n{ background:rgba(255,255,255,.25); color:#fff; }
  .tab.attn.zero{ opacity:.55; }
  .tsep{ width:1px; height:20px; background:var(--border-strong); margin:0 6px; }
  .search-box{ display:flex; align-items:center; gap:8px; flex:1; min-width:240px; max-width:380px; margin-left:auto; background:var(--surface); border:1px solid var(--border); padding:8px 12px; border-radius:8px; }
  .search-box:focus-within{ border-color:var(--accent); }
  .search-box svg{ width:16px; height:16px; color:var(--text-muted); flex-shrink:0; }
  .search-box input{ flex:1; border:none; background:none; font:inherit; font-size:13.5px; color:var(--text-primary); outline:none; min-width:0; }
  .search-box button{ border:none; background:none; color:var(--text-muted); display:flex; padding:0; cursor:pointer; }
  .search-box button svg{ width:16px; height:16px; }

  /* table card */
  .table-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; overflow-x:auto; box-shadow:0 1px 2px rgba(30,28,26,0.03); }
  .trow{ display:flex; align-items:center; gap:12px; padding:11px 20px; border-bottom:1px solid var(--border); transition:background-color .12s; min-width:900px; }
  .trow:last-child{ border-bottom:none; }
  .trow.body{ cursor:pointer; }
  .trow.body:hover{ background:var(--accent-bg); }
  .thead{ background:var(--surface-sunken); padding:9px 20px; }
  .thead .c{ font-size:11.5px; font-weight:600; letter-spacing:.04em; color:var(--text-muted); text-transform:uppercase; }
  .c{ min-width:0; font-size:13.5px; color:var(--text-primary); }
  .c .l1{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c .l2{ display:block; font-size:11.5px; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c.right{ text-align:right; }
  .mono{ font-family:var(--font-mono); font-size:13px; font-weight:500; }
  .strong{ font-weight:600; }
  .muted{ color:var(--text-muted); font-size:13px; }
  .clientlink{ color:var(--text-primary); font-weight:600; text-decoration:none; }
  .clientlink:hover{ color:var(--accent); text-decoration:underline; }
  .pillst{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .pillst::before{ content:''; width:6px; height:6px; border-radius:3px; background:currentColor; opacity:.9; }
  .pillst.neutral{ background:var(--surface-sunken); color:var(--text-secondary); }
  .pillst.info{ background:var(--accent-bg); color:var(--accent-ink); }
  .pillst.success{ background:var(--success-bg); color:var(--success); }
  .pillst.warning{ background:var(--warning-bg); color:var(--warning); }
  .pillst.danger{ background:var(--danger-bg); color:var(--danger); }
  .act{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act svg{ width:14px; height:14px; flex-shrink:0; color:var(--text-muted); }
  .act.warning, .act.warning svg{ color:var(--warning); font-weight:600; }
  .act.danger, .act.danger svg{ color:var(--danger); font-weight:600; }
  .act.success svg{ color:var(--success); }
  .act.info svg{ color:var(--accent); }
  .act .ago{ color:var(--text-muted); font-weight:400; margin-left:2px; }
  .c .flag{ display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .c .flag svg{ width:12px; height:12px; flex-shrink:0; }
  .c .flag.warning{ color:var(--warning); }
  .c .flag.danger{ color:var(--danger); }
  .c .flag.muted{ color:var(--text-muted); font-weight:500; }
  .rowmenu{ width:28px; height:28px; border-radius:6px; border:none; background:none; display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; margin-left:auto; }
  .rowmenu svg{ width:16px; height:16px; }
  .rowmenu:hover{ background:var(--accent-bg); color:var(--accent); }
  .cmenu{ width:40px; flex-shrink:0; display:flex; justify-content:flex-end; }

  .empty{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:56px 20px; color:var(--text-muted); }
  .empty svg{ width:34px; height:34px; }
  .empty b{ font-size:15px; color:var(--text-secondary); }
  .empty span{ font-size:13px; }
  .empty .btn{ margin-top:8px; }

  .pager{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:16px; font-size:13px; color:var(--text-muted); }
  .pager .btn{ padding:8px 14px; font-size:13px; }

  /* drawer */
  .scrim{ position:fixed; inset:0; background:rgba(30,26,20,.35); z-index:40; display:flex; justify-content:flex-end; }
  .scrim[hidden]{ display:none; }
  .drawer{ width:460px; max-width:92%; height:100%; background:var(--bg); border-left:1px solid var(--border); box-shadow:-12px 0 40px rgba(20,16,10,.18); display:flex; flex-direction:column; }
  .dhead{ display:flex; align-items:center; gap:10px; padding:18px 24px; border-bottom:1px solid var(--border); background:var(--surface); }
  .dhead .t{ flex:1; min-width:0; }
  .dhead h2{ font-family:var(--font-display); font-weight:600; font-size:19px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dhead .s{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
  .dhead .s b{ font-family:var(--font-mono); font-weight:500; color:var(--text-secondary); }
  .dclose{ width:28px; height:28px; border-radius:6px; border:none; background:none; color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .dclose:hover{ background:var(--surface-sunken); color:var(--text-primary); }
  .dclose svg{ width:18px; height:18px; }
  .dbody{ flex:1; overflow:auto; padding:20px 24px; display:flex; flex-direction:column; gap:16px; }
  .dfoot{ display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--border); background:var(--surface); position:relative; }
  .dfoot .btn{ flex:1; justify-content:center; }
  .timeline{ background:var(--accent-bg); border-left:3px solid var(--accent); border-radius:10px; padding:14px 16px; }
  .timeline .h{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
  .steps{ display:flex; align-items:flex-start; gap:4px; }
  .step{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; text-align:center; }
  .step .dot{ width:14px; height:14px; border-radius:999px; border:2px solid var(--border-strong); background:var(--surface); margin-bottom:6px; z-index:1; }
  .step.on .dot{ border-color:var(--step); background:var(--step); }
  .step .sl{ font-size:12px; font-weight:500; color:var(--text-muted); }
  .step.on .sl{ color:var(--text-primary); font-weight:600; }
  .step .st{ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); margin-top:2px; }
  .step .st.hl{ color:var(--warning); }
  .step .conn{ position:absolute; top:6px; left:60%; right:-40%; height:2px; background:var(--border); }
  .step.conn-on .conn{ background:var(--accent); }
  .bigmoney{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .bigmoney .k{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:4px; }
  .bigmoney .v{ font-family:var(--font-mono); font-weight:700; font-size:26px; line-height:1; }
  .bigmoney .v.danger{ color:var(--danger); }
  .bigmoney .v.success{ color:var(--success); }
  .bigmoney .of{ font-size:12.5px; color:var(--text-secondary); margin-top:6px; }
  .bigmoney .due{ text-align:right; font-size:12.5px; color:var(--text-secondary); }
  .bigmoney .due b{ display:block; font-size:13.5px; color:var(--text-primary); }
  .bigmoney .due b.danger{ color:var(--danger); }
  .bigmoney .due b.warning{ color:var(--warning); }
  .agrid{ display:flex; flex-wrap:wrap; gap:10px; }
  .atile{ flex:1 1 47%; display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; background:var(--surface-sunken); border:1px solid var(--border); font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text-primary); cursor:pointer; text-align:left; }
  .atile:hover{ background:var(--accent-bg); }
  .atile svg{ width:17px; height:17px; color:var(--accent); flex-shrink:0; }
  .atile.success{ border-color:#BFE3CC; color:var(--success); }
  .atile.success svg{ color:var(--success); }
  .atile.accentf{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .atile.accentf svg{ color:#fff; }
  .atile.accentf:hover{ background:var(--accent-hover); }
  .atile.danger{ border-color:#EFC9C6; color:var(--danger); }
  .atile.danger svg{ color:var(--danger); }
  .atile.wide{ flex-basis:100%; }
  .drow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0; }
  .drow .k{ font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }
  .drow .v{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--text-primary); text-align:right; min-width:0; }
  .drow .v svg{ width:14px; height:14px; color:var(--text-muted); flex-shrink:0; }
  .drow .v a{ color:var(--accent); text-decoration:none; font-weight:600; }
  .drow .v a:hover{ text-decoration:underline; }
  .dsec{ display:flex; flex-direction:column; gap:8px; }
  .dsec .k{ display:flex; align-items:center; justify-content:space-between; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }
  .dsec .k button{ border:none; background:none; font-family:inherit; font-size:12px; font-weight:600; color:var(--accent); cursor:pointer; text-transform:none; letter-spacing:0; display:inline-flex; align-items:center; gap:4px; padding:0; }
  .dsec .k button svg{ width:13px; height:13px; }
  .fu{ display:flex; align-items:flex-start; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .fu.due{ border-color:#F1D9B8; background:var(--warning-bg); }
  .fu input[type=checkbox]{ margin-top:2px; accent-color:var(--accent); width:15px; height:15px; cursor:pointer; }
  .fu .n{ flex:1; font-size:13.5px; color:var(--text-primary); }
  .fu .n.done{ text-decoration:line-through; color:var(--text-muted); }
  .fu .w{ font-size:11.5px; font-weight:600; margin-top:2px; }
  .fu .w.warning{ color:var(--warning); }
  .fu .w.muted{ color:var(--text-muted); font-weight:500; }
  .fu .w.danger{ color:var(--danger); }
  .dempty{ font-size:13px; color:var(--text-muted); }
  .pay{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; }
  .pay svg{ width:15px; height:15px; color:var(--success); flex-shrink:0; }
  .pay .m{ font-family:var(--font-mono); font-weight:600; margin-left:auto; }
  .pay .d{ color:var(--text-muted); }
  .form{ background:var(--surface); border:1px solid var(--border-strong); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .form .fr{ display:flex; gap:10px; }
  .form label{ flex:1; display:flex; flex-direction:column; gap:4px; font-size:11.5px; font-weight:600; color:var(--text-secondary); }

const LIB = Object.fromEntries(D.LIBRARY.map(x => [x.id, x]));
const PROD = Object.fromEntries(D.PRODUCTS.map(x => [x.id, x]));
const TASK = Object.fromEntries(D.TASKS.map(x => [x.id, x]));
const CUST = Object.fromEntries(D.CUSTOMERS.map(x => [x.id, x]));
const UNIT = { m2:'m²', lineal:'lm', each:'ea', hour:'hr', job:'job', day:'day' };
const KIND_LABEL = { labour:'Labour', material:'Material', equipment:'Equipment', trade:'Trade' };
const HZ = { refer:'Refer out', we_do:'We do it', subcontract:'Subcontracted' };
const r2 = (n) => Math.round((+n || 0) * 100) / 100;
const money = (n) => '$' + (Math.round((+n || 0) * 100) / 100).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qfmt = (n) => (n === null || n === undefined || isNaN(n)) ? '' : (Math.round(n * 10) / 10).toString();
const hfmt = (h) => { const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m/60)}h${m%60 ? ' ' + (m%60) + 'm' : ''}` : `${m}m`; };

// ---- area maths (metres in, metres out) ----
const areaCalc = (a) => { const w = +a.w || 0, l = +a.l || 0, h = +a.h || 0; return { walls: r2(2 * (w + l) * h), ceiling: r2(w * l), floor: r2(w * l), linear: r2(2 * (w + l)) }; };
const measured = (a) => !!a && (+a.w > 0) && (+a.l > 0) && (+a.h > 0);
const needsDims = (li) => li.kind === 'library' && li.qty_auto && (li.unit === 'm2' || li.unit === 'lineal');
function autoQty(li, area){
  if (!area || !measured(area)) return 0;
  const c = areaCalc(area); const lib = LIB[li.lib_id]; const cat = (lib?.category || '').toLowerCase();
  if (li.unit === 'm2') return /ceiling/.test(cat) ? c.ceiling : c.walls;
  if (li.unit === 'lineal') return c.linear;
  return 1;
}
// ---- line maths ----
function libRate(li){ const lib = LIB[li.lib_id]; if (!lib) return 0; if (lib.priced_by === 'hour') return lib.rates.c1 || 0; const r = lib.rates; const coat = li.coats === 1 ? r.c1 : li.coats === 3 ? r.c3 : r.c2; if (coat === null || coat === undefined) return 0; return r2((coat || 0) + (li.primer ? (r.primer || 0) : 0) + (li.prep ? (lib.prep_rate || 0) : 0)); }
function libMins(li){ const lib = LIB[li.lib_id]; if (!lib) return 0; if (lib.priced_by === 'hour') return 60; const m = lib.mins; const coat = li.coats === 1 ? m.c1 : li.coats === 3 ? m.c3 : m.c2; return (coat || 0) + (li.primer ? (m.primer || 0) : 0) + (li.prep ? (lib.prep_mins || 0) : 0); }
function unpriced(li){ const lib = LIB[li.lib_id]; if (!lib) return false; if (lib.priced_by === 'hour') return !lib.rates.c1; const r = lib.rates; const coat = li.coats === 1 ? r.c1 : li.coats === 3 ? r.c3 : r.c2; return coat === null || coat === undefined; }
function lineQty(li, est){ if (li.kind === 'library' && li.qty_auto) return autoQty(li, est.areas.find(a => a.id === li.area_id)); return +li.qty || 0; }
function lineRate(li){
  if (li.kind === 'library') return li.rate_override ?? libRate(li);
  if (li.kind === 'repair'){ const t = TASK[li.task_id]; if (li.hazard && (li.hazard_mode || 'refer') === 'refer') return 0; if (li.hazard && li.hazard_mode === 'subcontract') return r2((+li.sub_cost || 0) * (1 + (+li.markup_pct || 0) / 100)); return li.rate_override ?? (t?.rate || 0); }
  if (li.category === 'trade') return r2((+li.sub_cost || 0) * (1 + (+li.markup_pct || 0) / 100));
  return +li.rate || 0;
}
function lineTotal(li, est){ return r2(lineQty(li, est) * lineRate(li)); }
function lineHours(li, est){
  const q = lineQty(li, est);
  if (li.kind === 'library') return r2(q * libMins(li) / 60);
  if (li.kind === 'repair'){ if (li.hazard && (li.hazard_mode || 'refer') !== 'we_do') return 0; return r2(q * (TASK[li.task_id]?.mins || 0) / 60); }
  return r2(+li.hours || 0);
}
function lineMeta(li, est){
  const bits = [];
  if (li.kind === 'library'){ const lib = LIB[li.lib_id]; if (lib?.priced_by === 'hour') bits.push('hourly'); else { bits.push(`${li.coats} coat${li.coats === 1 ? '' : 's'}${li.primer ? ' + primer' : ''}${li.prep ? ' + prep' : ''}`); } if (li.product && PROD[li.product]) bits.push(`${PROD[li.product].brand} ${PROD[li.product].name}${li.colour ? ' in ' + esc(li.colour) : ''}`); const h = lineHours(li, est); if (h) bits.push(hfmt(h)); }
  else if (li.kind === 'repair'){ const t = TASK[li.task_id]; if (li.hazard) bits.push(`<b>${HZ[li.hazard_mode || 'refer']}</b>`); else { bits.push(t?.group || 'Repair'); const h = lineHours(li, est); if (h) bits.push(hfmt(h)); } }
  else { if (li.category === 'trade') bits.push(`sub-quote ${money(li.sub_cost)} + ${li.markup_pct}%`); else if (li.category === 'material' && li.product && PROD[li.product]) bits.push(PROD[li.product].pack); else if (li.hours) bits.push(hfmt(li.hours)); }
  if (li.notes) bits.push(`<i>${esc(li.notes)}</i>${li.note_show_on_quote ? ' (on quote)' : ''}`);
  return bits.join(' · ');
}
function displayUnit(li){ return UNIT[li.unit] || li.unit; }
function lineKindClass(li){ return li.kind === 'repair' ? 'repair' : li.kind === 'custom' ? li.category : 'library'; }
function clientKind(li){ if (li.kind === 'repair') return 'labour'; if (li.kind === 'custom') return li.category === 'material' ? 'material' : 'labour'; return 'labour'; }

// ---- estimate totals ----
function totals(est, selected){
  const sel = selected || new Set(est.accepted_options || []);
  const live = est.lines.filter(li => !li.optional || sel.has(li.id));
  const subtotal = r2(live.reduce((s, li) => s + lineTotal(li, est), 0));
  const optional = r2(est.lines.filter(li => li.optional && !sel.has(li.id)).reduce((s, li) => s + lineTotal(li, est), 0));
  const hours = r2(live.reduce((s, li) => s + lineHours(li, est), 0));
  const d = est.discount || {}; const discount = !d.enabled ? 0 : d.type === 'percent' ? r2(subtotal * (+d.value || 0) / 100) : Math.min(r2(+d.value || 0), subtotal);
  const base = r2(subtotal - discount);
  const tax = est.tax?.enabled ? r2(base * (+est.tax.rate || 0) / 100) : 0;
  return { subtotal, optional, hours, discount, base, tax, total: r2(base + tax) };
}
// ---- readiness checklist (the rail) ----
function checklist(est, cust){
  const out = [];
  est.areas.forEach(a => { const auto = est.lines.filter(li => li.area_id === a.id && needsDims(li)); if (auto.length && !measured(a)) out.push({ lvl:'red', text:`${a.name} isn't measured`, act:'measure', id:a.id }); });
  est.lines.filter(li => !li.optional).forEach(li => { if (li.kind === 'library' && unpriced(li) && li.rate_override === null) out.push({ lvl:'red', text:`${li.name.split(' · ').pop()} has no price`, act:'line', id:li.id }); else if (lineTotal(li, est) === 0 && !(li.kind === 'repair' && li.hazard) && !needsDims(li)) out.push({ lvl:'red', text:`${li.name} totals $0`, act:'line', id:li.id }); });
  if (!cust) out.push({ lvl:'red', text:'No client on this estimate', act:'contact' });
  else if (!cust.email) out.push({ lvl:'red', text:`Add ${cust.name.split(' ')[0]}'s email to send`, act:'contact' });
  if (!est.job.address) out.push({ lvl:'red', text:'No job address', act:'address' });
  if (!est.job.start_date) out.push({ lvl:'amber', text:'No start date on the quote', act:'job' });
  const noCol = est.lines.filter(li => !li.optional && li.kind === 'library' && li.product && !li.colour);
  if (noCol.length) out.push({ lvl:'amber', text:`${noCol.length} line${noCol.length === 1 ? ' has' : 's have'} no colour chosen`, act:'line', id: noCol[0].id });
  if (!(est.photos || []).length) out.push({ lvl:'amber', text:'No photos attached', act:'photos' });
  if (est.lines.some(li => li.kind === 'repair' && li.hazard && !li.hazard_mode)) out.push({ lvl:'amber', text:'Hazard found: choose refer / we do / subcontract', act:'line', id: est.lines.find(li => li.kind === 'repair' && li.hazard && !li.hazard_mode).id });
  out.push({ lvl:'ok', text:`${est.tax.label} ${est.tax.rate}% applied` });
  out.push({ lvl:'ok', text:'Terms and payment schedule from Settings' });
  return out;
}

// ---- invoice money ----
function invLineTotal(l){ return r2((+l.qty || 0) * (+l.rate || 0)); }
function invTotals(inv){
  const subtotal = r2(inv.lines.reduce((s, l) => s + invLineTotal(l), 0));
  const d = inv.discount || {}; const discount = !d.enabled ? 0 : d.type === 'percent' ? r2(subtotal * (+d.value || 0) / 100) : Math.min(r2(+d.value || 0), subtotal);
  const base = r2(subtotal - discount);
  const taxable = r2(inv.lines.filter(l => l.gst !== false).reduce((s, l) => s + invLineTotal(l), 0) - (subtotal ? discount * (inv.lines.filter(l => l.gst !== false).reduce((s, l) => s + invLineTotal(l), 0) / subtotal) : 0));
  const tax = inv.tax?.enabled ? r2(taxable * (+inv.tax.rate || 0) / 100) : 0;
  const total = r2(base + tax);
  const paid = r2((inv.payments || []).reduce((s, p) => s + (+p.amount || 0), 0));
  return { subtotal, discount, base, tax, total, paid, balance: r2(Math.max(0, total - paid)) };
}
const dayIso = (off) => (off === null || off === undefined) ? null : new Date(NOW + off * DAY).toISOString();
function invStatus(inv){ const t = invTotals(inv); if (inv.status === 'archived') return 'archived'; if (t.total > 0 && t.paid + 0.01 >= t.total) return 'paid'; const sent = inv.sent_at !== null && inv.sent_at !== undefined; if (sent && inv.due !== null && inv.due !== undefined && daysUntil(dayIso(inv.due)) < 0) return 'overdue'; if (t.paid > 0) return 'partial'; if (!sent) return 'draft'; return inv.viewed_at !== null && inv.viewed_at !== undefined ? 'viewed' : 'sent'; }
const INV_STATUS = { draft:['Draft','neutral'], sent:['Sent','info'], viewed:['Viewed','info'], partial:['Part paid','warning'], paid:['Paid','success'], overdue:['Overdue','danger'], archived:['Archived','neutral'] };
function scheduleAmounts(src){ return src.schedule.map(m => ({ ...m, ex: r2(src.subtotal * m.pct / 100), inc: r2(src.total * m.pct / 100) })); }
function scheduleState(src, invoices, thisInv){ const thisId = thisInv && thisInv.id; const ms = scheduleAmounts(src); return ms.map((m, i) => { if (thisInv && thisInv.kind === 'milestone' && thisInv.milestone === i) return { ...m, index: i, invoice: thisInv, state: 'this' }; const inv = invoices.find(x => x.estimate === src.id && x.kind === 'milestone' && x.milestone === i && x.id !== thisId); return { ...m, index: i, invoice: inv || null, state: inv ? invStatus(inv) : 'open' }; }); }
function invoicedSoFar(src, invoices, exceptId){ return r2(invoices.filter(x => x.estimate === src.id && x.id !== exceptId && invStatus(x) !== 'archived').reduce((s, x) => s + invTotals(x).total, 0)); }

function openPay(){
  const t = T(); const METHODS = ['Bank transfer', 'Cash', 'Card (in person)', 'Cheque'];
  modal(`${mhead('Record a payment', `${esc(inv.invoice_number)} · balance ${money(t.balance)}`)}<div class="mbody form"><div class="fr"><div class="fld"><label>Amount $</label><input type="number" id="py_amt" value="${t.balance}"><div class="chips" style="margin:6px 0 0"><button class="chip on" data-pyamt="${t.balance}">Full balance ${money(t.balance)}</button>${src() && inv.kind !== 'milestone' ? '' : ''}<button class="chip" data-pyamt="${r2(t.balance / 2)}">Half</button></div></div><div class="fld"><label>Received on</label><input type="text" id="py_date" value="${fmtDY(dayIso(0))}"></div></div><div class="fld"><label>Method</label><div class="chips" style="margin:0">${METHODS.map((m, i) => `<button class="chip ${i === 0 ? 'on' : ''}" data-pymethod="${m}">${m}</button>`).join('')}</div></div><div class="fld"><label>Note (optional)</label><input type="text" id="py_note" placeholder="e.g. Part payment, reference 4471"></div></div><div class="mfoot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="py_save">${svg('check')}Record payment</button></div>`);
}
function openSend(){
  const t = T(); const st = ST(); const reminder = isSent() && st === 'overdue'; const ck = checklist(); const ic = { red:'alert', amber:'warn', ok:'checkc' }; const red = reds();
  const first = cust ? esc(cust.name.split(' ')[0]) : 'there';
  const subject = reminder ? `Reminder: invoice ${esc(inv.invoice_number)} is overdue` : `Invoice ${esc(inv.invoice_number || '')} from ${esc(D.BUSINESS.business_name)}`;
  const body = reminder ? `Hi ${first},\n\nA quick reminder that invoice ${esc(inv.invoice_number)} for ${money(t.balance)} was due on ${fmtDY(dayIso(inv.due))}. You can pay by card on the link below or by bank transfer using the details on the invoice.\n\nThanks,` : `Hi ${first},\n\n${src() && inv.kind === 'milestone' ? `Here is the ${inv.lines[0]?.detail?.toLowerCase() || 'next'} invoice for the painting at ${esc(src().job)}.` : 'Here is your invoice.'} Pay by card on the link below or by bank transfer using the details on the invoice. ${inv.terms_days === 0 ? 'Payable on receipt.' : `Due within ${inv.terms_days} days.`}\n\nThanks,`;
  modal(`<div class="rs-head"><div><h2>${reminder ? 'Send a reminder' : isSent() ? 'Resend invoice' : 'Review &amp; send'}</h2><div class="s">Compose the email on the left · the client sees the invoice on the right</div></div><button class="qd-x" data-close aria-label="Close" data-testid="rs-close">${svg('close')}</button></div>
  <div class="rs-two">
    <div class="rs-left" data-testid="rs-left">
      <div class="rs-chk ${red ? 'bad' : 'ok'}" data-testid="rs-checklist"><div class="k">${red ? `${red} thing${red === 1 ? '' : 's'} to fix before it goes` : 'Ready to send'}</div><ul>${ck.map(c => `<li class="${c.lvl}">${svg(ic[c.lvl])}<span>${esc(c.text)}</span>${c.act && c.lvl !== 'ok' ? `<button data-fix="${c.act}" data-fixid="${c.id || ''}" data-closefirst="1">Fix</button>` : ''}</li>`).join('')}</ul></div>
      <div class="fld"><label>To (email)</label><input type="text" id="sd_to" value="${esc(cust?.email || '')}" placeholder="client@example.com" data-testid="rs-to"></div>
      <div class="fld"><label>Subject</label><input type="text" id="sd_subj" value="${subject}" data-testid="rs-subject"></div>
      <div class="fld"><div class="lr"><label>Message</label><button class="rs-ai" id="sd_ai" data-testid="rs-ai-draft">${svg('sparkle')}Draft with AI</button></div><textarea id="sd_msg" style="min-height:150px" data-testid="rs-body">${body}</textarea></div>
      <div class="fld"><label>Signature</label><textarea id="sd_sig" style="min-height:64px" data-testid="rs-signature">Josh Sano
${esc(D.BUSINESS.business_name)} · ${esc(D.BUSINESS.phone)}</textarea></div>
      <label class="rs-attach"><input type="checkbox" checked id="sd_pdf">Attach the PDF</label>
      <div class="rs-sms"><label class="cb"><input type="checkbox" id="sd_sms" data-testid="rs-sms-toggle"><span><b>Also text the invoice link</b><small>Uses the SMS number set up under CRM › Messages setup.</small></span></label><div class="rs-smsf" id="sd_smsf" hidden><input type="text" id="sd_phone" value="${esc(cust?.phone || '')}" placeholder="+61 4xx xxx xxx" data-testid="rs-sms-phone"><textarea id="sd_smstxt" style="min-height:56px">Hi ${first}, invoice ${esc(inv.invoice_number || '')} from ${esc(D.BUSINESS.business_name)} for ${money(t.balance)} is ready: {link}</textarea></div></div>
      <div class="err" id="sd_err" hidden data-testid="rs-error"></div>
      <button class="btn btn-primary rs-cta" id="sd_send" data-testid="rs-send" ${red ? 'disabled title="Fix the red items first"' : ''}>${svg('send')}${reminder ? 'Send reminder' : isSent() ? 'Resend invoice' : 'Send invoice'}</button>
      <div class="rs-sum">Balance due: <b>${money(t.balance)}</b> · ${inv.lines.length} line${inv.lines.length === 1 ? '' : 's'}${src() ? ` · from ${esc(src().number)}` : ''} · ${inv.due === null || inv.due === undefined ? 'no due date' : isSent() ? `due ${fmtDY(dayIso(inv.due))}` : `due ${inv.terms_days === 0 ? 'on receipt' : fmtDY(dayIso(inv.terms_days))} once sent`}</div>
    </div>
    <div class="rs-right" data-testid="rs-preview"><div class="rs-fit" id="rs_fit"><div class="cdoc" id="rs_doc"></div></div></div>
  </div>`, 'rs');
  $('#rs_doc').innerHTML = renderInvoiceDoc(inv, cust, D.BUSINESS, {});
  rsFit();
  $('#sd_sms').addEventListener('change', () => { $('#sd_smsf').hidden = !$('#sd_sms').checked; });
  $('#sd_ai').addEventListener('click', () => { say('Drafting with Claude…'); });
}
function rsFit(){ const pane = $('.rs-right'); const fit = $('#rs_fit'); if (!pane || !fit) return; const w = pane.clientWidth - 40; const sc = Math.min(1, w / 860); fit.style.transform = `scale(${sc})`; fit.style.width = '860px'; fit.style.marginBottom = `${-(1 - sc) * fit.scrollHeight}px`; }
window.addEventListener('resize', () => { if ($('#rs_fit')) rsFit(); });
function doSend(){ const to = $('#sd_to').value.trim(); const first = !isSent(); cust.email = to; if (first){ inv.sent_at = 0; inv.due = inv.terms_days; inv.status = 'sent'; if (XERO_ON) xero = { st: 'ok', at: 'just now' }; } inv.sent_to = to; inv.events.push({ type: first ? 'sent' : (ST() === 'overdue' ? 'reminder' : 'sent'), at: 0, text: `${first ? 'Sent' : ST() === 'overdue' ? 'Reminder sent' : 'Resent'} to ${to}${$('#sd_sms').checked ? ' + SMS' : ''}` });
  modal(`${mhead('Sent')}<div class="mbody"><div class="okbanner">${svg('checkc')}<div><b>Invoice ${esc(inv.invoice_number)} is on its way to ${esc(to)}.</b><br>${first ? `Due ${fmtDY(dayIso(inv.due))}. ` : ''}You will be notified when it is opened or paid.</div></div><div style="margin-top:14px;font-size:12px;font-weight:700;color:var(--text-secondary)">Invoice link</div><div class="linkbox" style="margin-top:6px"><span>https://app.painttradehq.com/invoice/2c9e…7a1b</span><button class="btn btn-ghost" id="copyLink" style="padding:5px 9px;font-size:12px">${svg('copy')}Copy</button></div></div><div class="mfoot"><button class="btn btn-primary" data-close>Done</button></div>`); changed(); }
function openNotes(){ $('#ndrawer').innerHTML = `<div class="sh-head"><div class="row"><h2>Activity</h2><button class="x" id="ndClose">${svg('close')}</button></div></div><div class="sh-body">${inv.events.length ? inv.events.slice().reverse().map(e => `<div class="ev">${svg(e.type === 'sent' || e.type === 'reminder' ? 'send' : e.type === 'viewed' ? 'eye' : e.type === 'payment' ? 'card' : 'clock')}<span>${esc(e.text)}</span><span class="t">${fmtD(dayIso(e.at))}</span></div>`).join('') : '<div class="aempty">Nothing yet. Sends, opens, reminders and payments appear here.</div>'}</div>`; $('#drawerwrap').hidden = false; }
function openMore(){ openPop($('#moreBtn'), `<button data-more="pdf">${svg('download')}Download PDF</button>${isSent() ? `<button data-more="link">${svg('link')}Copy invoice link</button>` : ''}<button data-more="dup">${svg('dup')}Duplicate invoice</button>${src() ? `<button data-more="est">${svg('doc')}Open quote ${esc(src().number)}</button>` : ''}<hr>${locked() ? `<button data-more="credit">${svg('undo')}Credit and re-issue</button>` : ''}<button data-more="archive" class="danger">${svg('archive')}Archive</button>`); }

// ---- events
document.addEventListener('click', (e) => {
  const t = e.target; const c = (s) => t.closest(s); const idEl = t.closest('button, a, .jcard'); const id = idEl ? idEl.id : t.id; let x;
  if (c('[data-close]')){ closeModal(); return; }
  if (id === 'v_build' || id === 'cvback'){ view = 'build'; render(); return; }
  if (id === 'v_client' || id === 'railPreview' || id === 'sd_preview'){ closeModal(); view = 'client'; render(); return; }
  if (id === 'sendBtn'){ if (ST() === 'paid'){ say(`Receipt emailed to ${cust.email}`); return; } openSend(); return; }
  if (id === 'sd_send'){ doSend(); return; }
  if (id === 'copyLink' || id === 'railLink'){ say('Invoice link copied'); return; }
  if (id === 'railReceipt'){ say(`Receipt emailed to ${cust.email}`); return; }
  if (id === 'payBtn' || id === 'railPay' || id === 'ledgerPay'){ openPay(); return; }
  if ((x = c('[data-pyamt]'))){ $('#py_amt').value = x.dataset.pyamt; $$('[data-pyamt]').forEach(b => b.classList.toggle('on', b === x)); return; }
  if ((x = c('[data-pymethod]'))){ $$('[data-pymethod]').forEach(b => b.classList.toggle('on', b === x)); return; }
  if (id === 'py_save'){ const amt = +$('#py_amt').value || 0; if (amt <= 0){ say('Enter an amount'); return; } const method = $('[data-pymethod].on').dataset.pymethod; inv.payments.push({ id: uid('p'), date: 0, method, amount: r2(amt), note: $('#py_note').value.trim(), source:'manual' }); inv.events.push({ type:'payment', at:0, text:`${method} ${money(amt)} recorded` }); if (ST() === 'paid') inv.paid_at = 0; closeModal(); changed(); say(ST() === 'paid' ? 'Paid in full' : `Recorded · ${money(T().balance)} still due`); return; }
  if (id === 'notesBtn'){ openNotes(); return; }
  if (id === 'ndClose'){ $('#drawerwrap').hidden = true; return; }
  if (id === 'moreBtn'){ openMore(); return; }
  if ((x = c('[data-more]'))){ closePop(); const m = x.dataset.more; if (m === 'link') say('Invoice link copied'); else if (m === 'pdf') say(`Downloading ${inv.invoice_number}.pdf`); else if (m === 'dup') say('Duplicated as INV-0032 (opens in a new tab)'); else if (m === 'est') go(`/admin/estimate/${src().id}`); else if (m === 'credit') creditReissue(); else if (m === 'archive'){ if (locked()) say('Invoices with payments cannot be archived. Credit it instead.'); else { say('Archived'); go('/admin/invoices'); } } return; }
  if (id === 'railPdf'){ say(`Downloading ${inv.invoice_number || 'invoice'}.pdf`); return; }
  if (id === 'creditBtn'){ creditReissue(); return; }
  if ((x = c('[data-fromest]'))){ linkQuote(x.dataset.fromest); return; }
  if (id === 'pickQuote' || (x = c('[data-pickq]'))){ qOpen = !qOpen || !!x; renderPaper(); if (qOpen){ $('.linkq')?.scrollIntoView({ behavior:'smooth', block:'center' }); $('#qq')?.focus(); } return; }
  if ((x = c('[data-unlink]'))){ unlinkQuote(); return; }
  if ((x = c('[data-closefirst]'))) closeModal();
  if ((x = c('[data-open="contact"]')) || (x = c('[data-fix="contact"]'))){ openContact(); return; }
  if ((x = c('[data-xopen]'))){ say('→ Xero · ' + inv.invoice_number); return; }
  if ((x = c('[data-xretry]'))){ say('Sending to Xero…'); setTimeout(() => { xero = { st: 'ok', at: 'just now' }; renderPaper(); say(`${inv.invoice_number} is in Xero`); }, 700); return; }
  if ((x = c('[data-open="terms"]')) || (x = c('[data-fix="terms"]'))){ openTerms(); return; }
  if ((x = c('[data-open="covers"]')) || (x = c('[data-fix="covers"]'))){ $('.covers')?.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
  if ((x = c('[data-open="job"]'))){ modal(`${mhead('Job address', 'Optional for a stand-alone invoice.')}<div class="mbody form"><div class="fld"><label>Site address</label><input type="text" id="jb_addr" value="${esc(inv.job || '')}"></div></div><div class="mfoot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="jb_save">Save</button></div>`); return; }
  if (id === 'jb_save'){ inv.job = $('#jb_addr').value.trim(); closeModal(); changed(); return; }
  if ((x = c('[data-fix="lines"]'))){ addOpen = true; renderPaper(); $('#al_name')?.focus(); return; }
  if ((x = c('[data-fix="line"]'))){ const l = lineById(x.dataset.fixid); const inp = $(`[data-r="${l.id}"]`); inp?.focus(); inp?.select(); return; }
  if (id === 'changeClient'){ openContact({ change:true }); return; }
  if (id === 'newContact'){ openContact({ create:true }); return; }
  if (id === 'backToList'){ openContact({ change:true }); return; }
  if ((x = c('[data-pick]'))){ cust = clone(CUST[x.dataset.pick]); inv.customer_id = cust.id; closeModal(); changed(); say(`${cust.name} added`); return; }
  if (id === 'cf_save'){ Object.assign(cust, { name: $('#cf_name').value.trim(), phone: $('#cf_phone').value.trim(), email: $('#cf_email').value.trim(), address: $('#cf_addr').value.trim() }); closeModal(); changed(); return; }
  if (id === 'cf_create'){ const nc = { id: uid('c_'), name: $('#cf_name').value.trim(), phone: $('#cf_phone').value.trim(), email: $('#cf_email').value.trim(), address: $('#cf_addr').value.trim() }; if (!nc.name) return; CUST[nc.id] = nc; D.CUSTOMERS.push(nc); cust = clone(nc); inv.customer_id = nc.id; closeModal(); changed(); return; }
  if ((x = c('[data-terms]'))){ $$('[data-terms]').forEach(b => b.classList.toggle('on', b === x)); return; }
  if (id === 'td_save'){ const on = $('[data-terms].on'); inv.terms_days = +on.dataset.terms; inv.terms_label = on.dataset.label; if (!isSent()) inv.due = inv.terms_days; inv.reference = $('#td_ref').value.trim(); inv.tax.enabled = $('#td_gst').checked; closeModal(); changed(); return; }
  if ((x = c('[data-covers]'))){ inv.kind = x.dataset.covers; if (inv.kind === 'custom'){ inv.lines = []; } else applyCovers(); changed(); return; }
  if ((x = c('[data-pickms]'))){ inv.milestone = +x.dataset.pickms; applyCovers(); changed(); return; }
  if (id === 'addLineBtn'){ addOpen = true; renderPaper(); $('#al_name')?.focus(); return; }
  if (id === 'al_done'){ addOpen = false; renderPaper(); return; }
  if (id === 'msgAdd'){ msgOpen = true; renderPaper(); $('#noteClient')?.focus(); return; }
  if ((x = c('[data-addkind]'))){ addKind = x.dataset.addkind; const n = $('#al_name').value; renderPaper(); $('#al_name').value = n; $('#al_name').focus(); return; }
  if (id === 'al_add'){ const name = $('#al_name').value.trim(); if (!name){ $('#al_name').focus(); say('Give the line a description'); return; } inv.lines.push({ id: uid('il'), kind: addKind, name, detail:'', qty: +$('#al_qty').value || 1, unit: $('#al_unit').value, rate: +$('#al_rate').value || 0, gst: true }); if (src() && inv.kind !== 'custom'){ inv.kind = 'custom'; } changed(); $('#al_name')?.focus(); return; }
  if ((x = c('[data-editline]'))){ if (locked()) return; const l = lineById(x.dataset.editline); modal(`${mhead('Line details')}<div class="mbody form"><div class="fld"><label>Description</label><input type="text" id="ld_name" value="${esc(l.name)}"></div><div class="fld"><label>Detail shown under it (optional)</label><input type="text" id="ld_detail" value="${esc(l.detail || '')}" placeholder="e.g. 2 coats exterior enamel, rust treated"></div><div class="fld"><label>Kind</label><div class="kinds">${KINDS.map(([k, lbl, i]) => `<button class="${l.kind === k ? 'on' : ''}" data-ldkind="${k}">${svg(i)}${lbl}</button>`).join('')}</div></div></div><div class="mfoot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ld_save" data-id="${l.id}">Save</button></div>`); return; }
  if ((x = c('[data-ldkind]'))){ $$('[data-ldkind]').forEach(b => b.classList.toggle('on', b === x)); return; }
  if (id === 'ld_save'){ const l = lineById(idEl.dataset.id); l.name = $('#ld_name').value.trim() || l.name; l.detail = $('#ld_detail').value.trim(); l.kind = $('[data-ldkind].on').dataset.ldkind; closeModal(); changed(); return; }
  if ((x = c('[data-lmenu]'))){ if (locked()) return; const l = lineById(x.dataset.lmenu); openPop(x, `<button data-lact="edit" data-id="${l.id}">${svg('edit')}Edit details</button><button data-lact="dup" data-id="${l.id}">${svg('dup')}Duplicate</button><hr><button data-lact="del" data-id="${l.id}" class="danger">${svg('trash')}Delete</button>`); return; }
  if ((x = c('[data-lact]'))){ closePop(); const l = lineById(x.dataset.id); const a = x.dataset.lact; if (a === 'edit') $(`[data-editline="${l.id}"]`).click(); else if (a === 'dup'){ inv.lines.splice(inv.lines.indexOf(l) + 1, 0, { ...clone(l), id: uid('il') }); changed(); } else { const i = inv.lines.indexOf(l); inv.lines.splice(i, 1); changed(); showUndo(`${l.name} deleted`, () => { inv.lines.splice(i, 0, l); changed(); }); } return; }
  if (id === 'undobtn'){ $('#undo').hidden = true; lastDeleted && lastDeleted(); lastDeleted = null; return; }
  if (id === 'discEdit'){ discOpen = !discOpen; renderRail(); return; }
  if (id === 'discClose'){ discOpen = false; renderRail(); return; }
  if (id === 'discRemove'){ inv.discount = { enabled:false, type:'percent', value:0, reason:'' }; discOpen = false; changed(); render(); return; }
  if ((x = c('[data-reason]'))){ const same = $('#discReason').value.trim() === x.dataset.reason; inv.discount.reason = same ? '' : x.dataset.reason; const tv = $('#discType').value, vv = $('#discVal').value; renderRail(); $('#discType').value = tv; $('#discVal').value = vv; return; }
  if (id === 'discApply'){ inv.discount = { enabled:true, type: $('#discType').value, value: +$('#discVal').value || 0, reason: $('#discReason').value.trim() }; if (!inv.discount.value) inv.discount.enabled = false; discOpen = false; changed(); return; }
  if (id === 'discClear'){ inv.discount = { enabled:false, type:'percent', value:0, reason:'' }; discOpen = false; changed(); return; }
});
function creditReissue(){ modal(`${mhead('Credit and re-issue', `${esc(inv.invoice_number)} has ${money(T().paid)} recorded against it, so its amounts stay as they are.`)}<div class="mbody form"><div style="font-size:13px;line-height:1.5">A credit note for the unpaid balance closes this invoice, and a new draft is created with the same lines and the payment carried across, so you can change what is billed without losing the money already received.</div></div><div class="mfoot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="creditGo">Credit ${esc(inv.invoice_number)} and open the new draft</button></div>`); }
document.addEventListener('click', (e) => { if (e.target.closest('#creditGo')){ closeModal(); say(`${inv.invoice_number} credited · INV-00${seq} opened as a draft`); } });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-q]')){ const l = lineById(t.dataset.q); l.qty = +t.value || 0; changed(); return; }
  if (t.matches('[data-r]')){ const l = lineById(t.dataset.r); l.rate = +t.value.replace(/[^0-9.]/g, '') || 0; changed(); return; }
  if (t.matches('[data-u]')){ lineById(t.dataset.u).unit = t.value; changed(); return; }
  if (t.matches('[data-gst]')){ lineById(t.dataset.gst).gst = t.checked; changed(); return; }
  if (t.id === 'noteClient'){ inv.note_client = t.value.trim(); changed(); return; }
});
document.addEventListener('input', (e) => { const t = e.target; if (t.id === 'qq'){ qQuery = t.value; $('#qlist').innerHTML = quoteRows(); return; } if (t.id === 'cq'){ const v = t.value; openContact({ change:true, q:v }); const n = $('#cq'); n.focus(); n.setSelectionRange(v.length, v.length); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ if (!$('#modal').hidden) closeModal(); else if (!$('#drawerwrap').hidden) $('#drawerwrap').hidden = true; closePop(); } if (e.key === 'Enter' && e.target.matches('[data-q], [data-r], #al_name, #al_rate')){ if (e.target.id === 'al_name' || e.target.id === 'al_rate') $('#al_add').click(); else e.target.blur(); } });
document.addEventListener('click', (e) => { if (!e.target.closest('#pop') && !e.target.closest('[data-lmenu],#moreBtn')) closePop(); });
$('#modal').addEventListener('click', (e) => { if (e.target === $('#modal')) closeModal(); });
$('#drawerwrap').addEventListener('click', (e) => { if (e.target === $('#drawerwrap')) $('#drawerwrap').hidden = true; });
render();
$('#savedtxt').textContent = STATE === 'new' ? 'Draft saved' : 'Saved';
if (STATE === 'new') say(`${inv.invoice_number} reserved · add a client and lines, or bill a quote`);

</script>
</body>
